<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call screens · C + D combo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #050508; color: #fff; font-family: 'Inter', sans-serif; padding: 20px 12px; }
  h1 { margin: 0; font-size: 20px; font-weight: 300; letter-spacing: .02em; } p { color: #8b8b9a; font-size: 12px; margin: 6px 0 18px; }
  .wrap { position: relative; width: 100%; max-width: 1340px; margin: 0 auto; overflow: hidden; }
  .stage { position: absolute; top: 0; left: 0; width: 1340px; display: flex; gap: 20px; transform-origin: 0 0; }
  .cell { width: 320px; flex-shrink: 0; }
  .cell b { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #8b8b9a; text-align: center; margin-bottom: 10px; font-weight: 400; }
  .cell a { color: #00f2fe; font-size: 11px; display: block; text-align: center; margin-top: 8px; }
  iframe { width: 320px; height: 700px; border: 0; border-radius: 36px; box-shadow: 0 0 0 7px #101016; background: #07070c; }
</style>
</head>
<body>
  <h1>Call screens · layout C + colours D</h1>
  <p>These are the live pages, fully working: tap buttons, open gift / top-up, switch voice ↔ video.</p>
  <div class="wrap" id="wrap"><div class="stage" id="stage"></div></div>
<script>
  const pages = [['Voice call', '../13-audio-call.html?id=1'], ['Video calling', '../09-outgoing-call.html?id=2&stay=1'],
    ['Video call', '../10-video-call.html?id=3'], ['Incoming (host)', '../11-incoming-call.html?id=2&type=audio&stay=1']];
  document.getElementById('stage').innerHTML = pages.map(([t, u]) =>
    `<div class="cell"><b>${t}</b><iframe src="${u}"></iframe><a href="${u}" target="_blank">open ↗</a></div>`).join('');
  function fit() {
    const s = Math.min(1, document.getElementById('wrap').clientWidth / 1340);
    const st = document.getElementById('stage'); st.style.transform = `scale(${s})`;
    document.getElementById('wrap').style.height = 760 * s + 'px';
  }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
