<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VIBE · Gifts</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="assets/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .tabn { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #6b6b7b; padding-bottom: 12px; position: relative; line-height: 1; }
  .tabn.on { color: #fff; } .tabn.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, #ff2a85, #00f2fe); }
  .gi { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: #1a1a26; border: 1px solid #2a2a3a; flex-shrink: 0; color: #f6dc9b; }
</style>
</head>
<body>
<main class="phone">
  <div class="blob w-72 h-72 bg-cyberGold/10 -top-24 -right-24"></div>
  <header class="relative flex items-center gap-3 px-4 pt-5 pb-3">
    <button onclick="history.length > 1 ? history.back() : vibe.go('24-host-dashboard.html')" class="w-10 h-10 rounded-full btn-ghost flex items-center justify-center" aria-label="Back"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 class="text-xl font-semibold">Gifts</h1>
  </header>
  <div class="relative flex gap-6 px-5 border-b border-white/10" id="tabs"><button class="tabn on" data-t="recv">Received</button><button class="tabn" data-t="sent">Sent</button></div>
  <section class="relative flex-1 overflow-y-auto px-5 pt-4 pb-6">
    <div id="sum" class="rounded-2xl border border-cyberGold/30 p-4 flex items-center gap-3" style="background:linear-gradient(135deg,rgba(120,80,10,.3),#12121c 70%)"></div>
    <div id="list" class="mt-2"></div>
  </section>
</main>
<script>
  // DEMO. Gifts are created and priced in the admin panel (with animation files). Totals and history come from the SERVER.
  const $ = i => document.getElementById(i);
  const G = '<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>';
  const D = { recv: [['Rose x5', 'Rahul', 'Today, 2:10 pm', 90], ['Teddy', 'Sam', 'Today, 11:40 am', 120], ['Coffee', 'Karan', 'Yesterday', 30], ['Ring', 'Arjun', '12 Oct', 300], ['Rose', 'Vikram', '10 Oct', 18]],
    sent: [['Rose', 'Priya', 'Today, 2:10 pm', 20], ['Coffee', 'Ananya', 'Yesterday', 50], ['Teddy', 'Kabir', '11 Oct', 200]] };
  let tab = 'recv';
  function paint() {
    document.querySelectorAll('.tabn').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
    const rows = D[tab], total = rows.reduce((a, r) => a + r[3], 0);
    $('sum').innerHTML = `<div class="flex-1"><div class="text-[10px] tracking-[.16em] uppercase text-gray-400">${tab === 'recv' ? 'You earned from gifts' : 'You spent on gifts'}</div><div class="flex items-center gap-2 mt-1"><span class="coin w-7 h-7"></span><span class="text-3xl font-black text-cyberGold">${total.toLocaleString('en-IN')}</span></div></div><div class="text-right text-xs text-gray-400">${rows.length} gifts</div>`;
    $('list').innerHTML = rows.map(([g, p, t, c]) => `<div class="flex items-center gap-3 py-3.5 border-b border-white/5"><span class="gi">${G}</span><div class="flex-1 min-w-0"><div class="text-sm font-medium">${g}</div><div class="text-[11px] text-gray-500">${tab === 'recv' ? 'From ' : 'To '}${p} · ${t}</div></div>
      <b class="${tab === 'recv' ? 'text-onlineGreen' : 'text-gray-300'} flex items-center gap-1">${tab === 'recv' ? '+' : '−'}${c}</b></div>`).join('');
  }
  $('tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b) { tab = b.dataset.t; paint(); } };
  paint();
</script>
</body>
</html>
