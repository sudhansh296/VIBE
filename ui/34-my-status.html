<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VIBE · My status</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="assets/theme.js"></script>
<script src="assets/status-data.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .glassbtn { width: 42px; height: 42px; border-radius: 99px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
  .vrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .vrow:last-child { border: 0; }
</style>
</head>
<body>
<main class="phone">
  <div id="bg" class="absolute inset-0"></div>
  <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-transparent to-black/60"></div>

  <header class="relative z-10 flex items-center gap-3 px-4 pt-5">
    <div class="flex-1 min-w-0"><b class="block text-[15px]">Your status</b><span id="meta" class="text-[11px] text-white/70"></span></div>
    <button onclick="history.length > 1 ? history.back() : vibe.go('05-home.html')" class="glassbtn" aria-label="Close"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </header>

  <div class="relative z-0 flex-1 flex items-start justify-center px-8 pt-20 text-center"><p id="txt" class="text-[24px] font-semibold leading-snug drop-shadow-lg"></p></div>

  <!-- views sheet -->
  <div class="relative z-10 rounded-t-3xl bg-cyberCard/95 backdrop-blur border-t border-cyberLine px-5 pt-3 pb-5" style="max-height:58%;overflow-y:auto">
    <div class="w-10 h-1 rounded-full bg-white/20 mx-auto mb-3"></div>
    <div class="flex items-center">
      <div class="flex items-center gap-2 flex-1"><svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><b id="views" class="text-lg"></b></div>
      <button id="del" class="h-9 px-4 rounded-full border border-dangerRed/50 text-dangerRed text-xs flex items-center gap-1.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>Delete</button>
    </div>
    <p id="exp" class="text-[11px] text-gray-500 mt-1"></p>
    <div id="list" class="mt-2"></div>
    <button onclick="vibe.go('33-status-create.html')" class="mt-3 w-full h-12 rounded-2xl btn-ghost text-sm font-semibold">Add new status</button>
  </div>

  <!-- delete confirm -->
  <div id="dw" class="sheet-wrap" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="sheet glass rounded-t-3xl p-6 border-t border-cyberLine">
      <h3 class="text-lg font-semibold text-center">Delete this status?</h3>
      <p class="text-sm text-gray-400 text-center mt-2">It will disappear for everyone right away.</p>
      <div class="grid grid-cols-2 gap-3 mt-6"><button onclick="document.getElementById('dw').classList.remove('open')" class="h-12 rounded-2xl btn-ghost font-semibold">Cancel</button><button id="dyes" class="h-12 rounded-2xl font-bold text-white" style="background:linear-gradient(135deg,#ff4d5e,#b3122f)">Delete</button></div>
    </div>
  </div>
</main>
<script>
  // DEMO. Views, hearts and replies are recorded by the server; statuses are removed after 24 hours.
  const $ = id => document.getElementById(id);
  const mine = window.STATUS.mine() || { text: 'Weekend vibes', bg: ['#4facfe', '#1e3a8a', '#0a1230'], aud: 'all', views: 24 };
  $('bg').style.background = `linear-gradient(160deg, ${mine.bg[0]}, ${mine.bg[1]} 55%, ${mine.bg[2]})`;
  $('txt').textContent = mine.text;
  $('meta').textContent = `35m ago · ${mine.aud === 'fol' ? 'Followers only' : 'Everyone'}`;
  $('views').textContent = `${mine.views} views`; $('exp').textContent = 'Expires in 23h 25m';
  const V = [['Aisha', '2m ago', 'heart', ['#ff2a85', '#7a1fd1']], ['Kavya', '10m ago', 'Replied', ['#a855f7', '#581c87']], ['Sana', '18m ago', '', ['#f6d365', '#9a3412']], ['Zoya', '31m ago', 'heart', ['#f43f5e', '#86198f']]];
  $('list').innerHTML = V.map(([n, t, tag, g]) => `<div class="vrow"><div class="w-11 h-11 rounded-full flex items-center justify-center font-semibold" style="background:linear-gradient(135deg,${g[0]},${g[1]})">${n[0]}</div>
    <div class="flex-1"><div class="text-sm font-medium">${n}</div><div class="text-[11px] text-gray-500">${t}</div></div>
    ${tag === 'heart' ? '<svg class="w-5 h-5 text-neonPink" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.4-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.6-9.5 9-9.5 9Z"/></svg>' : tag ? `<span class="text-[11px] px-2.5 py-1 rounded-full bg-neonPink/15 text-neonPink font-semibold">${tag}</span>` : ''}</div>`).join('');
  $('del').onclick = () => $('dw').classList.add('open');
  $('dyes').onclick = () => { window.STATUS.setMine(null); vibe.toast('Status deleted'); setTimeout(() => vibe.go('05-home.html'), 700); };
</script>
</body>
</html>
