<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VIBE · Daily check-in</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="assets/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .day { position: relative; border: 1.5px solid #262636; background: linear-gradient(170deg, #171724, #10101a); border-radius: 22px; padding: 14px 6px 12px; text-align: center; transition: all .2s; overflow: hidden; }
  .day .lbl { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #6b6b7b; }
  .day .amt { font-size: 15px; font-weight: 800; color: #f6dc9b; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .day .art { height: 54px; display: flex; align-items: center; justify-content: center; position: relative; margin: 6px 0 4px; }
  .day.done { border-color: rgba(62,224,143,.4); background: linear-gradient(170deg, rgba(62,224,143,.14), #10101a); }
  .day.done .coin { opacity: .45; filter: saturate(.6); }
  .day.done .amt { color: #3ee08f; }
  .day .tick { position: absolute; right: -6px; bottom: -4px; width: 22px; height: 22px; border-radius: 99px; background: #3ee08f; color: #06150d; display: flex; align-items: center; justify-content: center; border: 2px solid #10101a; }
  .day.today { border-color: #ff2a85; background: linear-gradient(170deg, rgba(255,42,133,.22), #10101a); box-shadow: 0 0 26px -6px #ff2a85; animation: nudge 1.6s ease-in-out infinite; }
  .day.today .lbl { color: #ff2a85; font-weight: 700; }
  .day.today .coin { animation: spin 2.4s ease-in-out infinite; }
  .day.jackpot { grid-column: span 3; display: flex; align-items: center; gap: 14px; padding: 16px 18px; text-align: left; border-color: rgba(246,220,155,.5); background: linear-gradient(120deg, rgba(246,220,155,.22), rgba(255,42,133,.10) 60%, #10101a); box-shadow: 0 0 30px -10px rgba(246,220,155,.6); }
  .day.jackpot .art { height: 64px; width: 64px; margin: 0; flex-shrink: 0; }
  .day.jackpot.done { border-color: rgba(62,224,143,.4); background: linear-gradient(120deg, rgba(62,224,143,.16), #10101a); box-shadow: none; }
  .day.jackpot .amt { font-size: 26px; justify-content: flex-start; }
  .tag { position: absolute; top: 0; right: 0; font-size: 9px; font-weight: 800; letter-spacing: .1em; padding: 3px 9px; border-radius: 0 20px 0 12px; background: linear-gradient(90deg, #f6dc9b, #eab308); color: #000; }
  @keyframes spin { 0%,100% { transform: rotateY(0) } 50% { transform: rotateY(180deg) } }
  @keyframes nudge { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
  .fly { position: absolute; left: 50%; top: 52%; font-weight: 800; color: #f6dc9b; font-size: 28px; animation: fly 1.4s ease-out forwards; pointer-events: none; z-index: 40; }
  @keyframes fly { from { opacity: 1; transform: translate(-50%, 0) scale(.8) } to { opacity: 0; transform: translate(-50%, -120px) scale(1.4) } }
</style>
</head>
<body>
<main class="phone">
  <div class="blob w-72 h-72 bg-onlineGreen/10 -top-24 -right-24"></div>
  <div class="blob w-64 h-64 bg-cyberGold/10 bottom-20 -left-24"></div>

  <header class="relative flex items-center gap-3 px-4 pt-5 pb-3">
    <button onclick="history.length > 1 ? history.back() : vibe.go('17-me.html')" class="w-10 h-10 rounded-full btn-ghost flex items-center justify-center" aria-label="Back">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 class="text-xl font-semibold">Daily check-in</h1>
  </header>

  <section class="relative flex-1 overflow-y-auto px-5 pb-6">
    <div class="text-center mt-3">
      <img src="assets/icons/ghost-empty.webp" class="w-28 h-28 object-contain mx-auto float" alt="" onerror="this.src='assets/icons/home.webp'">
      <h2 class="text-2xl font-light mt-1">Day <span id="streak">3</span> streak</h2>
      <p class="text-sm text-gray-400 mt-1">Free coins every day. No purchase needed.</p>
    </div>

    <div id="days" class="grid grid-cols-3 gap-3 mt-6"></div>

    <div class="mt-5 rounded-2xl border border-cyberGold/30 bg-cyberGold/5 p-4 flex items-center gap-3">
      <svg class="w-6 h-6 text-cyberGold shrink-0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
      <p class="text-sm text-gray-300 leading-snug">Miss a day and the streak restarts from Day 1.</p>
    </div>
    <p class="text-[11px] text-gray-500 text-center mt-4">Rewards are decided by VIBE and added by the server.</p>
  </section>

  <footer class="relative p-5 pt-3 glass border-t border-cyberLine/60">
    <button id="go" class="btn-neon w-full h-14 rounded-2xl font-bold"></button>
  </footer>
</main>
<script>
  // DEMO. The server decides which day it is and how many coins to give.
  const REWARDS = [10, 10, 20, 20, 30, 30, 100];
  let today = 2, collected = false; // index of today's box (days before it are done)
  const $ = id => document.getElementById(id);
  function paint() {
    const GIFT = '<svg class="w-10 h-10 text-cyberGold" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>';
    const TICK = '<span class="tick"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg></span>';
    $('days').innerHTML = REWARDS.map((c, i) => {
      const done = i < today || (i === today && collected), isToday = i === today && !collected, big = i === 6;
      const size = big ? '' : i < 2 ? 'w-9 h-9' : i < 4 ? 'w-10 h-10' : 'w-12 h-12';
      const art = `<div class="art">${big ? GIFT : `<span class="coin ${size}"></span>`}${done ? TICK : ''}</div>`;
      const amt = `<div class="amt">${done ? 'Collected' : '+' + c}</div>`;
      if (big) return `<div class="day jackpot ${done ? 'done' : isToday ? 'today' : ''}"><span class="tag">JACKPOT</span>${art}
        <div><div class="lbl">Day 7 · Streak bonus</div><div class="amt">${done ? 'Collected' : '+' + c + ' coins'}</div><div class="text-[11px] text-gray-400 mt-0.5">${done ? 'See you next week' : 'Check in 7 days in a row'}</div></div></div>`;
      return `<div class="day ${done ? 'done' : isToday ? 'today' : ''}"><div class="lbl">${isToday ? 'Today' : 'Day ' + (i + 1)}</div>${art}${amt}</div>`;
    }).join('');
    $('streak').textContent = collected ? today + 1 : today;
    $('go').disabled = collected;
    $('go').textContent = collected ? 'Come back tomorrow' : `Collect today's ${REWARDS[today]} coins`;
  }
  $('go').onclick = () => {
    collected = true; paint();
    const f = document.createElement('div'); f.className = 'fly'; f.textContent = `+${REWARDS[today]}`; document.querySelector('.phone').appendChild(f); setTimeout(() => f.remove(), 1500);
    vibe.toast('Coins added to your wallet');
  };
  paint();
</script>
</body>
</html>
