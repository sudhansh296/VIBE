<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VIBE · Call ended</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="assets/theme.js"></script>
<script src="assets/demo-data.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .star { font-size: 40px; color: #2a2a3a; transition: transform .15s, color .15s; cursor: pointer; }
  .star.on { color: #f6dc9b; filter: drop-shadow(0 0 10px rgba(246,220,155,.7)); }
  .star:active { transform: scale(1.3); }
  .pop { animation: pop .35s cubic-bezier(.2,1.6,.4,1); } @keyframes pop { from { transform: scale(.6) } to { transform: none } }
</style>
</head>
<body>
<main class="phone">
  <div class="blob w-72 h-72 bg-neonPink/15 -top-24 -left-24"></div>
  <div class="blob w-72 h-72 bg-neonCyan/10 bottom-20 -right-24"></div>

  <header class="relative flex items-center justify-end px-5 pt-5">
    <button onclick="done(false)" class="text-sm text-gray-400">Skip</button>
  </header>

  <section class="relative flex-1 overflow-y-auto px-6 pb-4 flex flex-col items-center text-center">
    <div class="avatar-ring mt-2" id="av"></div>
    <h1 class="text-xl font-bold mt-4">Call with <span id="name"></span> ended</h1>

    <div class="grid grid-cols-3 gap-2 w-full mt-5">
      <div class="rounded-2xl bg-cyberCard border border-cyberLine py-3"><div class="text-lg font-bold" id="dur"></div><div class="text-[11px] text-gray-500">Duration</div></div>
      <div class="rounded-2xl bg-cyberCard border border-cyberLine py-3"><div class="text-lg font-bold text-cyberGold flex items-center justify-center gap-1"><span class="coin w-4 h-4"></span><span id="spent"></span></div><div class="text-[11px] text-gray-500">Coins spent</div></div>
      <div class="rounded-2xl bg-cyberCard border border-cyberLine py-3"><div class="text-lg font-bold" id="gifts"></div><div class="text-[11px] text-gray-500">Gifts sent</div></div>
    </div>

    <p class="text-gray-200 font-semibold mt-8">How was your call?</p>
    <div class="flex gap-2 mt-2" id="stars"></div>
    <p id="starLbl" class="text-sm text-gray-400 h-5 mt-1"></p>

    <div class="flex flex-wrap gap-2 justify-center mt-5" id="tags"></div>

    <div class="w-full mt-5 neon-field rounded-2xl p-3 text-left">
      <textarea id="note" rows="2" maxlength="140" class="w-full bg-transparent outline-none text-sm resize-none placeholder:text-gray-600" placeholder="Anything else? (optional, only our team sees this)"></textarea>
    </div>

    <div id="followCard" class="w-full mt-4 rounded-2xl neon-border p-3 flex items-center gap-3 text-left">
      <div id="smallAv"></div>
      <div class="flex-1"><b class="text-sm" id="followTitle"></b><div class="text-xs text-gray-400">Get notified when they're online</div></div>
      <button onclick="follow(this)" class="px-4 h-9 rounded-full btn-neon text-xs font-bold">＋ Follow</button>
    </div>

    <button onclick="vibe.toast('Report sent to our safety team')" class="mt-5 text-sm text-dangerRed flex items-center gap-1.5">🚩 Report a problem</button>
  </section>

  <footer class="relative p-5 pt-2 flex gap-3">
    <button onclick="callAgain()" class="flex-1 h-14 rounded-2xl btn-ghost font-semibold text-sm flex items-center justify-center gap-2"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M5 5.5h8.5a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3z"/><path d="M17.5 10.2l3.4-2.3c.5-.3 1.1 0 1.1.6v6.9c0 .6-.6.9-1.1.6l-3.4-2.3z"/></svg>Call again</button>
    <button id="submit" onclick="done(true)" disabled class="flex-[1.4] h-14 rounded-2xl btn-neon font-bold">Submit</button>
  </footer>
</main>

<script>
  const D = window.DEMO, q = new URLSearchParams(location.search);
  const h = D.hosts.find(x => x.id === +(q.get('id') || 1)) || D.hosts[0];
  const secs = +(q.get('secs') || 384), spent = +(q.get('spent') || 420), gifts = +(q.get('gifts') || 1);
  document.getElementById('av').innerHTML = D.avatar(h, 'w-24 h-24 rounded-full border-4 border-cyberDark text-4xl');
  document.getElementById('smallAv').innerHTML = D.avatar(h, 'w-11 h-11 rounded-full text-base');
  document.getElementById('name').textContent = h.n;
  if (q.get('type') === 'audio') document.querySelector('h1').firstChild.textContent = 'Voice call with ';
  document.getElementById('followTitle').textContent = `Follow ${h.n}`;
  document.getElementById('dur').textContent = `${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`;
  document.getElementById('spent').textContent = spent.toLocaleString('en-IN');
  document.getElementById('gifts').textContent = gifts;

  const LABELS = ['', 'Bad 😞', 'Not great 😕', 'Okay 🙂', 'Good 😊', 'Amazing! 🤩'];
  const GOOD = ['😊 Friendly', '🎵 Great vibe', '😂 Funny', '🧠 Smart', '🗣️ Good listener', '✨ Respectful'];
  const BAD = ['🔇 Bad audio', '📵 Bad video', '😶 Didn\'t talk', '⏱️ Ended early', '🚫 Rude', '⚠️ Inappropriate'];
  let stars = 0; const picked = new Set();
  const box = document.getElementById('stars');
  for (let i = 1; i <= 5; i++) {
    const s = document.createElement('span'); s.className = 'star'; s.textContent = '★';
    s.onclick = () => { stars = i; drawStars(); drawTags(); document.getElementById('submit').disabled = false; };
    box.appendChild(s);
  }
  function drawStars() {
    [...box.children].forEach((s, i) => { s.classList.toggle('on', i < stars); if (i === stars - 1) { s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop'); } });
    document.getElementById('starLbl').textContent = LABELS[stars];
  }
  function drawTags() {
    picked.clear();
    const list = stars >= 4 ? GOOD : stars ? BAD : [];
    document.getElementById('tags').innerHTML = list.map(t => `<button class="chip px-3.5 h-9 rounded-full text-sm">${t}</button>`).join('');
    document.querySelectorAll('#tags .chip').forEach(c => c.onclick = () => { c.classList.toggle('on'); picked.has(c.textContent) ? picked.delete(c.textContent) : picked.add(c.textContent); });
  }
  function follow(b) { b.textContent = '✓ Following'; b.className = 'px-4 h-9 rounded-full btn-ghost text-xs font-bold text-gray-300'; }
  function callAgain() { vibe.go(`09-outgoing-call.html?id=${h.id}`); }
  function done(sent) { if (sent) vibe.toast('Thanks for your feedback! 💖'); setTimeout(() => vibe.go('05-home.html'), sent ? 900 : 0); }
</script>
</body>
</html>
