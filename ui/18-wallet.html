<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VIBE · Wallet</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="assets/theme.js"></script>
<script src="assets/demo-data.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .tabn { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #6b6b7b; padding-bottom: 12px; position: relative; line-height: 1; }
  .tabn.on { color: #fff; }
  .tabn.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, #ff2a85, #00f2fe); }
  .pack { position: relative; border: 1.5px solid #262636; background: #12121c; border-radius: 20px; padding: 22px 8px 12px; text-align: center; transition: all .18s; }
  .pack.on { border-color: #f6dc9b; background: linear-gradient(160deg, rgba(246,220,155,.14), #12121c); box-shadow: 0 0 24px -8px rgba(246,220,155,.6); }
  .tag { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 2px 8px; border-radius: 99px; font-size: 9px; font-weight: 700; letter-spacing: .06em; background: linear-gradient(90deg, #ff2a85, #7a1fd1); }
  .ok-pop { animation: pop .5s cubic-bezier(.2,1.5,.4,1) both; } @keyframes pop { from { transform: scale(.5); opacity: 0 } to { transform: none; opacity: 1 } }
</style>
</head>
<body>
<main class="phone">
  <div class="blob w-72 h-72 bg-cyberGold/10 -top-24 -right-24"></div>

  <header class="relative flex items-center gap-3 px-4 pt-5 pb-3">
    <button onclick="history.length > 1 ? history.back() : vibe.go('17-me.html')" class="w-10 h-10 rounded-full btn-ghost flex items-center justify-center" aria-label="Back">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 class="text-xl font-semibold flex-1">Wallet</h1>
  </header>

  <!-- balance -->
  <div class="relative mx-5 rounded-3xl p-5 border border-cyberGold/40 overflow-hidden" style="background:linear-gradient(135deg,rgba(120,80,10,.4),#12121c 65%)">
    <div class="absolute -right-8 -top-10 w-36 h-36 rounded-full bg-cyberGold/20 blur-2xl"></div>
    <div class="relative text-[10px] tracking-[.16em] uppercase text-gray-300">Coin balance</div>
    <div class="relative flex items-center gap-3 mt-1"><span class="coin w-10 h-10"></span><span id="bal" class="text-4xl font-black text-cyberGold"></span></div>
    <div id="mins" class="relative text-xs text-gray-400 mt-2"></div>
  </div>

  <div class="relative flex gap-6 px-5 mt-5 border-b border-white/10" id="tabs">
    <button class="tabn on" data-t="recharge">Recharge</button><button class="tabn" data-t="history">History</button>
  </div>

  <!-- recharge -->
  <section id="v-recharge" class="relative flex-1 overflow-y-auto px-5 pt-4 pb-6">
    <div class="rounded-2xl border border-onlineGreen/30 bg-onlineGreen/10 px-4 py-3 text-sm flex items-center gap-3">
      <svg class="w-5 h-5 text-onlineGreen shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
      <span>First recharge bonus: <b class="text-onlineGreen">+50% extra coins</b></span></div>

    <h3 class="text-[10px] tracking-[.16em] uppercase text-gray-500 mt-5 mb-3">Choose a pack</h3>
    <div id="packs" class="grid grid-cols-3 gap-3"></div>

    <h3 class="text-[10px] tracking-[.16em] uppercase text-gray-500 mt-6 mb-3">Pay with</h3>
    <div id="methods" class="grid grid-cols-4 gap-2 text-xs"></div>
    <p class="text-[11px] text-gray-500 mt-4 text-center leading-relaxed">Secure payment by Razorpay. Coins are added only after the server confirms your payment.</p>
  </section>

  <!-- history -->
  <section id="v-history" class="hidden relative flex-1 overflow-y-auto px-5 pt-4 pb-6"></section>

  <footer id="payBar" class="relative p-5 pt-3 glass border-t border-cyberLine/60">
    <button id="pay" class="btn-neon w-full h-14 rounded-2xl font-bold"></button>
  </footer>

  <!-- success -->
  <div id="ok" class="hidden absolute inset-0 z-50 bg-black/80 backdrop-blur items-center justify-center flex-col text-center px-8">
    <div class="ok-pop w-24 h-24 rounded-full flex items-center justify-center border-2 border-onlineGreen text-onlineGreen"><svg class="w-12 h-12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg></div>
    <h2 class="text-2xl font-light mt-5">Payment successful</h2>
    <p id="okTxt" class="text-cyberGold text-lg font-semibold mt-1"></p>
    <button onclick="closeOk()" class="mt-8 h-12 px-10 rounded-full bg-white text-cyberDark font-bold text-sm">Done</button>
  </div>
</main>

<script>
  // DEMO only. Coin packs, prices, bonuses and the balance come from the SERVER; the app never decides amounts.
  const D = window.DEMO, $ = id => document.getElementById(id);
  let balance = D.balance, pick = 2, method = 0, tab = 'recharge';
  const PACKS = [[600, 49], [1500, 99, 'Popular'], [3500, 199, '+50% first'], [8000, 399], [18000, 799, 'Best value'], [40000, 1599]];
  const METHODS = ['UPI', 'GPay', 'PhonePe', 'Card'];
  const HISTORY = [
    [1500, 'Recharge', 'Today, 11:20 am'], [-420, 'Video call · Priya', 'Today, 2:10 pm'], [-200, 'Message · Ananya', 'Today, 1:30 pm'],
    [20, 'Daily check-in', 'Sat, 9:02 am'], [-20, 'Gift · Rose', 'Fri, 8:14 pm'], [-360, 'Voice call · Ananya', 'Thu, 6:05 pm'], [3500, 'Recharge', 'Mon, 10:40 am'],
  ];
  const coin = c => `<span class="coin ${c}"></span>`;

  function paint() {
    $('bal').textContent = balance.toLocaleString('en-IN');
    $('mins').textContent = `About ${Math.floor(balance / 60)} min of video or ${Math.floor(balance / 30)} min of voice calls`;
    $('packs').innerHTML = PACKS.map(([c, p, t], i) => `<button data-p="${i}" class="pack ${i === pick ? 'on' : ''}">${t ? `<span class="tag">${t}</span>` : ''}
      ${coin('w-8 h-8 mx-auto block')}<div class="text-cyberGold font-extrabold mt-2">${c.toLocaleString('en-IN')}</div><div class="text-xs text-gray-400 mt-0.5">₹${p}</div></button>`).join('');
    $('methods').innerHTML = METHODS.map((m, i) => `<button data-m="${i}" class="chip h-12 rounded-2xl ${i === method ? 'on' : ''}">${m}</button>`).join('');
    $('pay').textContent = `Pay ₹${PACKS[pick][1]}`;
  }
  function paintHistory() {
    $('v-history').innerHTML = HISTORY.map(([c, t, d]) => `<div ${t === 'Recharge' ? 'onclick="vibe.go(\'45-receipt.html\')"' : ''} class="flex items-center gap-3 py-3.5 border-b border-white/5 ${t === 'Recharge' ? 'cursor-pointer' : ''}">
      <span class="w-10 h-10 rounded-full border flex items-center justify-center ${c > 0 ? 'border-onlineGreen/40 text-onlineGreen' : 'border-white/15 text-gray-400'}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">${c > 0 ? '<path d="M12 19V5M5 12l7-7 7 7"/>' : '<path d="M12 5v14M5 12l7 7 7-7"/>'}</svg></span>
      <div class="flex-1"><div class="text-sm">${t}</div><div class="text-[11px] text-gray-500 mt-0.5">${d}</div></div>
      <div class="font-semibold flex items-center gap-1 ${c > 0 ? 'text-onlineGreen' : 'text-gray-300'}">${c > 0 ? '+' : '−'}${Math.abs(c).toLocaleString('en-IN')}</div></div>`).join('');
  }
  $('packs').onclick = e => { const b = e.target.closest('[data-p]'); if (b) { pick = +b.dataset.p; paint(); } };
  $('methods').onclick = e => { const b = e.target.closest('[data-m]'); if (b) { method = +b.dataset.m; paint(); } };
  $('tabs').onclick = e => {
    const b = e.target.closest('[data-t]'); if (!b) return; tab = b.dataset.t;
    document.querySelectorAll('.tabn').forEach(x => x.classList.toggle('on', x === b));
    $('v-recharge').classList.toggle('hidden', tab !== 'recharge'); $('v-history').classList.toggle('hidden', tab !== 'history');
    $('payBar').classList.toggle('hidden', tab !== 'recharge');
  };
  $('pay').onclick = () => {
    if (METHODS[method] === 'Card') return vibe.go('44-payment-result.html?s=failed');   // demo: card always fails
    const [c, p] = PACKS[pick]; $('pay').innerHTML = '<span class="inline-block w-5 h-5 border-2 border-white/40 border-t-white rounded-full animate-spin align-middle"></span>';
    setTimeout(() => { balance += c; HISTORY.unshift([c, 'Recharge', 'Just now']); paint(); paintHistory();
      $('okTxt').textContent = `+${c.toLocaleString('en-IN')} coins added`; $('ok').classList.remove('hidden'); $('ok').classList.add('flex'); }, 1100);
  };
  function closeOk() { $('ok').classList.add('hidden'); $('ok').classList.remove('flex'); }
  paint(); paintHistory();
</script>
</body>
</html>
