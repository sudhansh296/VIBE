<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tab bar · 4 Magnify dock</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="../assets/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  /* Option 4: a glossy dock; the active ghost grows out of the dock with a mirror reflection and a pedestal glow */
  .dock { position: absolute; left: 24px; right: 24px; bottom: 16px; height: 64px; border-radius: 22px; z-index: 30;
    background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.02)); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,.12); box-shadow: 0 18px 40px -10px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.12);
    display: flex; align-items: flex-end; justify-content: space-around; padding-bottom: 6px; }
  .tab { position: relative; width: 88px; display: flex; flex-direction: column; align-items: center; }
  .tab .icon { position: relative; transition: transform .4s cubic-bezier(.2,1.5,.4,1); transform-origin: bottom center; }
  .tab img { width: 48px; height: 48px; object-fit: contain; display: block; opacity: .6; transition: opacity .3s; }
  .tab .mirror { position: absolute; top: 100%; left: 0; width: 48px; height: 48px; transform: scaleY(-1); opacity: 0;
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,.35), transparent 55%); mask-image: linear-gradient(to top, rgba(0,0,0,.35), transparent 55%); transition: opacity .3s; }
  .tab .label { font-size: 10px; color: #8a8a99; height: 0; opacity: 0; transition: all .3s; }
  .tab.active .icon { transform: translateY(-26px) scale(1.45); }
  .tab.active img { opacity: 1; }
  .tab.active .mirror { opacity: 1; }
  .tab.active .label { opacity: 1; color: #fff; font-weight: 700; transform: translateY(-14px); }
  .tab.active::before { content: ''; position: absolute; bottom: -4px; width: 46px; height: 8px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,42,133,.9), rgba(0,242,254,.4) 50%, transparent 70%); filter: blur(2px); }
  .badge { position: absolute; top: -4px; right: -6px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 99px; font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; background: #ff2a85; border: 2px solid #12121c; }
</style>
</head>
<body>
<main class="phone">
  <section id="content" class="flex-1 overflow-y-auto pb-32"></section>
  <nav class="dock">
    <button class="tab active" data-tab><span class="icon"><img src="../assets/icons/home.webp" alt=""><img class="mirror" src="../assets/icons/home.webp" alt=""></span><span class="label">Home</span></button>
    <button class="tab" data-tab><span class="icon"><img src="../assets/icons/chat.webp" alt=""><img class="mirror" src="../assets/icons/chat.webp" alt=""><b class="badge">3</b></span><span class="label">Chats</span></button>
    <button class="tab" data-tab><span class="icon"><img src="../assets/icons/profile.webp" alt=""><img class="mirror" src="../assets/icons/profile.webp" alt=""></span><span class="label">Me</span></button>
  </nav>
</main>
<script src="shell.js"></script>
</body>
</html>
