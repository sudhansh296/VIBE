<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tab bar · 5 Expanding pill</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="../assets/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  /* Option 5: compact bar; the active tab stretches into a neon gradient pill with the ghost and its name side by side */
  .nav { position: absolute; left: 0; right: 0; bottom: 0; height: 82px; z-index: 30; padding: 0 18px 10px;
    background: rgba(10,10,16,.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,.05);
    display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tab { position: relative; height: 56px; flex: 0 0 64px; border-radius: 20px; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: flex-basis .45s cubic-bezier(.2,1,.3,1), background .3s, box-shadow .3s; overflow: visible; }
  .tab img { width: 46px; height: 46px; object-fit: contain; opacity: .55; transition: all .35s; flex-shrink: 0; }
  .tab span { max-width: 0; overflow: hidden; white-space: nowrap; font-size: 14px; font-weight: 700; opacity: 0; transition: all .35s; }
  .tab.active { flex-basis: 170px; background: linear-gradient(120deg, rgba(255,42,133,.95), rgba(122,31,209,.9) 60%, rgba(0,242,254,.85));
    box-shadow: 0 10px 28px -8px rgba(255,42,133,.8), inset 0 1px 0 rgba(255,255,255,.3); }
  .tab.active img { opacity: 1; transform: scale(1.12) translateY(-6px); filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
  .tab.active span { max-width: 80px; opacity: 1; }
  .badge { position: absolute; top: -4px; right: 2px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; background: #ff2a85; border: 2px solid #0a0a10; }
  .tab.active .badge { background: #fff; color: #ff2a85; }
</style>
</head>
<body>
<main class="phone">
  <section id="content" class="flex-1 overflow-y-auto pb-28"></section>
  <nav class="nav">
    <button class="tab active" data-tab><img src="../assets/icons/home.webp" alt=""><span>Home</span></button>
    <button class="tab" data-tab><img src="../assets/icons/chat.webp" alt=""><span>Chats</span><b class="badge">3</b></button>
    <button class="tab" data-tab><img src="../assets/icons/profile.webp" alt=""><span>Me</span></button>
  </nav>
</main>
<script src="shell.js"></script>
</body>
</html>
