<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VIBE · Tab bar options</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="../assets/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  body { display: block; padding: 24px 16px; }
  .wrap { max-width: 1400px; margin: 0 auto; }
  .grid6 { display: grid; gap: 24px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  iframe { width: 100%; height: 640px; border: 1px solid #262636; border-radius: 28px; background: #07070c; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="text-2xl font-black grad-text">Bottom tab bar · 6 options</h1>
  <p class="text-sm text-gray-400 mt-1 mb-6">Tap the tabs inside each phone to see the animation. Tell me the number you like.</p>
  <div class="grid6" id="g"></div>
</div>
<script>
  const opts = [
    ['tabbar-1-floating-pill.html', '1 · Floating glass pill', 'Bar floats above the bottom; active ghost sits on a glowing disc'],
    ['tabbar-2b-center-notch-pro.html', '2B · Center notch PRO (new)', 'Smoother notch, neon edge glow, halo + sparkles, bounce and gradient labels'],
    ['tabbar-2-center-notch.html', '2 · Center notch', 'Big Chats button in a curved notch with a spinning neon ring'],
    ['tabbar-3-sliding-glow.html', '3 · Sliding glow', 'Neon light beam slides over the active tab'],
    ['tabbar-4-magnify-dock.html', '4 · Magnify dock', 'Active ghost grows out of the dock with a reflection'],
    ['tabbar-5-expanding-pill.html', '5 · Expanding pill', 'Active tab stretches into a gradient pill with its name'],
    ['tabbar-6-bubble-pop.html', '6 · Bubble pop', 'Active ghost pops into a floating bubble; bar cut-out slides'],
  ];
  document.getElementById('g').innerHTML = opts.map(([f, t, d]) => `
    <div><div class="flex items-baseline justify-between mb-2"><b>${t}</b><a href="${f}" target="_blank" class="text-xs text-neonCyan">open ↗</a></div>
    <p class="text-xs text-gray-500 mb-3">${d}</p><iframe src="${f}" loading="lazy"></iframe></div>`).join('');
</script>
</body>
</html>
