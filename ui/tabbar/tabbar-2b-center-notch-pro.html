<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tab bar · 2B Center notch pro</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="../assets/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  /* Option 2B: refined center-notch bar */
  .nav { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; z-index: 30; padding-bottom: env(safe-area-inset-bottom); }
  .nav svg.bg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 104px; overflow: visible; }

  /* side tabs */
  .side { position: absolute; bottom: 12px; width: 96px; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: transform .12s; }
  .side:active { transform: scale(.92); }
  .side .ico { position: relative; width: 50px; height: 50px; }
  .side .ico::before { content: ''; position: absolute; inset: 6px; border-radius: 99px; opacity: 0; transition: opacity .3s;
    background: radial-gradient(circle, rgba(0,242,254,.45), rgba(255,42,133,.18) 55%, transparent 72%); filter: blur(6px); }
  .side img { position: relative; width: 50px; height: 50px; object-fit: contain; opacity: .55; filter: grayscale(.25) brightness(.9); transition: opacity .3s, filter .3s; }
  .side span { font-size: 11.5px; color: #8b8b9a; font-weight: 500; transition: color .3s; }
  .side .dot { width: 0; height: 4px; border-radius: 4px; margin-top: 3px; background: linear-gradient(90deg, #ff2a85, #00f2fe);
    box-shadow: 0 0 8px #ff2a85, 0 0 14px #00f2fe; transition: width .35s cubic-bezier(.2,1.4,.4,1); }
  .side.active .ico::before { opacity: 1; }
  .side.active img { opacity: 1; filter: drop-shadow(0 4px 10px rgba(0,242,254,.55)); }
  .side.active span { background: linear-gradient(90deg, #00f2fe, #ff2a85); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 700; }
  .side.active .dot { width: 20px; }
  .side.bounce .ico { animation: bounce .55s cubic-bezier(.2,1.6,.4,1); }
  @keyframes bounce { 0% { transform: translateY(0) scale(1) } 35% { transform: translateY(-9px) scale(1.12) } 100% { transform: translateY(-3px) scale(1.04) } }
  .side.active .ico { transform: translateY(-3px) scale(1.04); }

  /* center chat button: just the chat ghost, floating in the notch */
  .center { position: absolute; left: 50%; bottom: 28px; width: 96px; height: 96px; margin-left: -48px; transition: transform .15s; }
  .center:active { transform: scale(.92); }
  .center .float-wrap { position: absolute; inset: 0; animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg) } 50% { transform: translateY(-7px) rotate(2deg) } }
  .center img { width: 96px; height: 96px; object-fit: contain; animation: beat 1.8s ease-in-out infinite;
    filter: drop-shadow(0 6px 14px rgba(255,42,133,.55)) drop-shadow(0 0 18px rgba(0,242,254,.35)); }
  @keyframes beat { 0%,100% { transform: scale(1) } 12% { transform: scale(1.08, .95) } 24% { transform: scale(.97, 1.04) } 36% { transform: scale(1) } }
  /* soft light pool under the ghost instead of a circle */
  .center .pool { position: absolute; left: 50%; bottom: -6px; width: 70px; height: 14px; margin-left: -35px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,42,133,.75), rgba(0,242,254,.25) 55%, transparent 72%); filter: blur(3px); animation: pool 3s ease-in-out infinite; }
  @keyframes pool { 0%,100% { transform: scaleX(1); opacity: .9 } 50% { transform: scaleX(.75); opacity: .55 } }
  .center.active img { filter: drop-shadow(0 6px 16px rgba(255,42,133,.85)) drop-shadow(0 0 26px rgba(0,242,254,.6)); }

  /* unread badge: glossy heart with the count */
  /* sits exactly over the heart drawn in chat.webp, so the ghost "holds" the count */
  .badge { position: absolute; top: 3px; right: 3px; z-index: 3; width: 33px; height: 31px; animation: badge-in .6s cubic-bezier(.2,1.8,.4,1), badge-beat 2.4s ease-in-out .6s infinite; }
  .badge svg { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 0 6px rgba(255,42,133,.9)) drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  .badge b { position: absolute; inset: 0; padding-bottom: 3px; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px rgba(122,0,60,.8); }
  @keyframes badge-in { from { transform: scale(0) rotate(-30deg) } to { transform: none } }
  @keyframes badge-beat { 0%,100% { transform: scale(1) } 8% { transform: scale(1.18) } 16% { transform: scale(.96) } 24% { transform: scale(1.08) } 32% { transform: scale(1) } }
  .center-label { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); font-size: 11.5px; color: #8b8b9a; font-weight: 500; transition: color .3s; }
  .center.active ~ .center-label { background: linear-gradient(90deg, #ff2a85, #00f2fe); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 700; }
</style>
</head>
<body>
<main class="phone">
  <section id="content" class="flex-1 overflow-y-auto pb-36"></section>

  <nav class="nav">
    <svg class="bg" viewBox="0 0 420 104" preserveAspectRatio="none">
      <defs>
        <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16121f" stop-opacity=".96"/><stop offset="1" stop-color="#07070c"/></linearGradient>
        <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#00f2fe" stop-opacity=".15"/><stop offset=".35" stop-color="#ff2a85" stop-opacity=".9"/><stop offset=".5" stop-color="#ff2a85"/><stop offset=".65" stop-color="#a855f7" stop-opacity=".9"/><stop offset="1" stop-color="#00f2fe" stop-opacity=".15"/></linearGradient>
        <filter id="glow" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
      </defs>
      <path d="M0,30 H138 C158,30 164,34 170,46 C180,62 194,72 210,72 C226,72 240,62 250,46 C256,34 262,30 282,30 H420 V104 H0 Z" fill="url(#fill)"/>
      <path d="M0,30 H138 C158,30 164,34 170,46 C180,62 194,72 210,72 C226,72 240,62 250,46 C256,34 262,30 282,30 H420" fill="none" stroke="url(#edge)" stroke-width="4" filter="url(#glow)" opacity=".7"/>
      <path d="M0,30 H138 C158,30 164,34 170,46 C180,62 194,72 210,72 C226,72 240,62 250,46 C256,34 262,30 282,30 H420" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
    </svg>

    <button class="side active" data-tab style="left:18px"><span class="ico"><img src="../assets/icons/home.webp" alt=""></span><span>Home</span><i class="dot"></i></button>

    <button class="center" data-tab aria-label="Chats">
      <span class="pool"></span>
      <span class="float-wrap"><img src="../assets/icons/chat.webp" alt="">
        <span class="badge">
          <svg viewBox="0 0 30 28"><defs>
            <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5fa6"/><stop offset=".55" stop-color="#ff2a85"/><stop offset="1" stop-color="#b3127a"/></linearGradient>
            <linearGradient id="hs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
            <path d="M15 27 C6 20 1 15 1 9 C1 4.5 4.5 1 9 1 C11.6 1 13.8 2.3 15 4.3 C16.2 2.3 18.4 1 21 1 C25.5 1 29 4.5 29 9 C29 15 24 20 15 27 Z" fill="url(#hg)" stroke="#07070c" stroke-width="1.6"/>
            <ellipse cx="9.5" cy="7" rx="5" ry="3" fill="url(#hs)" transform="rotate(-25 9.5 7)"/>
          </svg><b>3</b>
        </span>
      </span>
    </button>
    <span class="center-label">Chats</span>

    <button class="side" data-tab style="right:18px"><span class="ico"><img src="../assets/icons/profile.webp" alt=""></span><span>Me</span><i class="dot"></i></button>
  </nav>
</main>
<script src="shell.js"></script>
<script>
  window.onTab = (i, t) => {
    if (!t.classList.contains('side')) return;
    t.classList.remove('bounce'); void t.offsetWidth; t.classList.add('bounce');
  };
</script>
</body>
</html>
