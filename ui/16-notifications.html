<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VIBE · Notifications</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="assets/theme.js"></script>
<script src="assets/demo-data.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .tabn { position: relative; padding-bottom: 12px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #6b6b7b; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .tabn.on { color: #fff; }
  .tabn.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, #ff2a85, #00f2fe); }
  .tabn { line-height: 1; }
  .tabn i { font-style: normal; box-sizing: border-box; min-width: 17px; height: 17px; padding: 0 5px; border-radius: 99px; background: #ff2a85; color: #fff;
    font-size: 10px; line-height: 17px; letter-spacing: 0; font-weight: 700; text-align: center; display: inline-block; transform: translateY(-1px); font-variant-numeric: tabular-nums; }
  .gh { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #6b6b7b; margin: 18px 4px 8px; }
  .wrap { position: relative; margin-bottom: 8px; border-radius: 18px; overflow: hidden; }
  .del { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 24px; background: rgba(255,77,94,.14); color: #ff4d5e; }
  .item { position: relative; display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: #0d0d14; border: 1px solid rgba(255,255,255,.08);
    touch-action: pan-y; transition: transform .2s, background .2s; }
  .item.unread { background: #11101a; border-color: rgba(255,42,133,.22); }
  .item.unread::before { content: ''; position: absolute; left: 0; top: 16px; bottom: 16px; width: 3px; border-radius: 0 3px 3px 0; background: linear-gradient(#ff2a85, #00f2fe); }
  .item.leaving { transform: translateX(-110%) !important; opacity: 0; transition: transform .25s, opacity .25s; }
  .ring { width: 46px; height: 46px; border-radius: 99px; display: flex; align-items: center; justify-content: center; border: 1px solid; flex-shrink: 0; }
  .ring svg { width: 21px; height: 21px; }
  .tag { position: absolute; right: -2px; bottom: -2px; width: 19px; height: 19px; border-radius: 99px; background: #07070c; border: 1px solid; display: flex; align-items: center; justify-content: center; }
  .tag svg { width: 10px; height: 10px; }
  .item b { font-weight: 500; color: #fff; }
  .act { height: 32px; padding: 0 14px; border-radius: 99px; font-size: 11px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; flex-shrink: 0; border: 1px solid rgba(255,255,255,.2); color: #fff; }
  .act.primary { background: #fff; color: #07070c; border-color: #fff; }
  .offer { position: relative; margin: 14px 0 4px; padding: 16px; border-radius: 20px; overflow: hidden; }
  .offer::before { content: ''; position: absolute; inset: 0; border-radius: 20px; padding: 1px; background: linear-gradient(135deg, #ff2a85, #00f2fe); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .offer .glow { position: absolute; right: -30px; top: -40px; width: 140px; height: 140px; border-radius: 99px; background: radial-gradient(circle, rgba(255,42,133,.35), transparent 70%); }
</style>
</head>
<body>
<main class="phone">
  <div class="blob w-64 h-64 bg-neonPink/10 -top-24 -right-20"></div>

  <header class="relative flex items-center gap-3 px-4 pt-5 pb-4">
    <button onclick="history.length > 1 ? history.back() : vibe.go('05-home.html')" class="w-10 h-10 rounded-full btn-ghost flex items-center justify-center" aria-label="Back">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="flex-1"><h1 class="text-xl font-semibold leading-tight">Notifications</h1><p id="sub" class="text-[11px] text-gray-500 tracking-wide"></p></div>
    <button id="readAll" onclick="readAll()" class="h-9 px-3 rounded-full border border-white/15 text-[11px] tracking-wide flex items-center gap-1.5 text-gray-200">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="m2 13 4 4 8-9M10 15l2 2 9-10"/></svg>Read all</button>
  </header>

  <nav id="tabs" class="relative flex gap-5 px-5 border-b border-white/10 overflow-x-auto"></nav>
  <section id="list" class="relative flex-1 overflow-y-auto px-4 pb-10"></section>

  <div id="undo" class="hidden absolute left-4 right-4 bottom-5 z-50 items-center rounded-2xl pl-4 pr-2 py-1.5" style="background:#1a1a24;border:1px solid rgba(255,255,255,.12)">
    <span class="flex-1 text-[13px]">Notification removed</span>
    <button onclick="undoRemove()" class="text-[12px] font-bold tracking-[.14em] text-neonPink px-3 py-2">UNDO</button>
  </div>
</main>

<script>
  // DEMO list; real notifications come from the server (and arrive as push notifications too).
  const D = window.DEMO, H = id => D.hosts.find(h => h.id === id);
  const S = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const I = {
    missed: S('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/><path d="m16 3 5 5M21 3l-5 5"/>'),
    phone: S('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>'),
    video: S('<rect x="2.5" y="6" width="13.5" height="12" rx="3"/><path d="m16 11 5-3v8l-5-3"/>'),
    follow: S('<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/>'),
    gift: S('<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/>'),
    coin: S('<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4"/>'),
    check: S('<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>'),
    news: S('<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1Z"/><path d="M15 9a4 4 0 0 1 0 6M18 7a7 7 0 0 1 0 10"/>'),
    shield: S('<path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6Z"/><path d="m9 12 2 2 4-4"/>'),
    online: S('<circle cx="12" cy="12" r="2.5"/><path d="M7.5 7.5a6.4 6.4 0 0 0 0 9M16.5 7.5a6.4 6.4 0 0 1 0 9"/>'),
    trash: S('<path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/>'),
  };
  const TONE = { missed: '#ff4d5e', call: '#3ee08f', social: '#ff2a85', wallet: '#f6dc9b', system: '#00f2fe', online: '#3ee08f' };

  let items = [
    { g: 'Today', type: 'calls', tone: 'missed', icon: 'missed', host: 4, text: '<b>Rahul</b> missed your voice call', time: '9:41 pm', act: ['Call back', '13-audio-call.html?id=4', true], unread: true },
    { g: 'Today', type: 'social', tone: 'social', icon: 'follow', host: 1, text: '<b>Priya</b> started following you', time: '2:12 pm', act: ['Follow back', null], unread: true },
    { g: 'Today', type: 'social', tone: 'social', icon: 'gift', host: 3, text: '<b>Ananya</b> sent you a Rose', time: '1:05 pm', act: ['Say thanks', '15-chat.html?id=3'], unread: true },
    { g: 'Today', type: 'wallet', tone: 'wallet', icon: 'coin', text: 'Recharge successful <b>+1,500 coins</b>', time: '11:20 am' },
    { g: 'Today', type: 'social', tone: 'online', icon: 'online', host: 6, text: '<b>Kabir</b> is online now', time: '10:02 am', act: ['Chat', '15-chat.html?id=6'] },
    { g: 'Yesterday', type: 'system', tone: 'system', icon: 'check', text: 'Your host application was <b>approved</b>. You can start earning.', time: '8:30 pm' },
    { g: 'Yesterday', type: 'calls', tone: 'call', icon: 'video', host: 2, text: 'Video call with <b>Arjun</b> · 03:10 · 200 coins', time: '6:15 pm' },
    { g: 'Earlier', type: 'wallet', tone: 'wallet', icon: 'gift', text: 'Daily check-in <b>+20 free coins</b>', time: 'Sat' },
    { g: 'Earlier', type: 'system', tone: 'system', icon: 'shield', text: 'We removed an account you reported. Thanks for keeping VIBE safe.', time: 'Thu' },
  ];
  let offerOn = true, filter = 'all';
  const FILTERS = [['all', 'All'], ['calls', 'Calls'], ['social', 'Social'], ['wallet', 'Wallet'], ['system', 'VIBE']];
  const unreadOf = f => items.filter(n => n.unread && (f === 'all' || n.type === f)).length;

  function pic(n) {
    const c = TONE[n.tone], h = n.host && H(n.host);
    const tag = `<span class="tag" style="border-color:${c}66;color:${c}">${I[n.icon]}</span>`;
    if (h) return `<div class="relative shrink-0">${D.avatar(h, 'w-[46px] h-[46px] rounded-full text-base')}${tag}</div>`;
    return `<div class="ring" style="border-color:${c}55;color:${c};background:${c}12">${I[n.icon]}</div>`;
  }
  function row(n, i) {
    return `<div class="wrap" data-i="${i}"><div class="del">${I.trash.replace('<svg', '<svg width="22" height="22"')}</div>
      <div class="item ${n.unread ? 'unread' : ''}">
        ${pic(n)}
        <div class="flex-1 min-w-0 text-[13px] leading-snug text-gray-300">${n.text}<div class="text-[11px] text-gray-500 mt-1 tracking-wide">${n.time}</div></div>
        ${n.act ? `<button data-act="${i}" class="act ${n.act[2] ? 'primary' : ''}">${n.act[0]}</button>` : ''}
      </div></div>`;
  }
  function offerCard() {
    return `<div class="offer" id="offer"><span class="glow"></span>
      <button onclick="dismissOffer()" class="absolute top-3 right-3 w-7 h-7 rounded-full flex items-center justify-center text-gray-400" aria-label="Dismiss"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <p class="text-[10px] tracking-[.18em] uppercase text-neonPink font-semibold">Weekend offer</p>
      <h3 class="text-lg font-light mt-1 pr-8">2× XP on every call till Sunday</h3>
      <p class="text-xs text-gray-400 mt-1">Talk more, level up faster, unlock better rewards.</p>
      <button onclick="vibe.go('20-level.html')" class="act primary mt-3">View rewards</button></div>`;
  }
  function render() {
    // header + tabs
    const total = unreadOf('all');
    document.getElementById('sub').textContent = total ? `${total} new` : 'You are all caught up';
    document.getElementById('readAll').style.opacity = total ? 1 : .35;
    document.getElementById('tabs').innerHTML = FILTERS.map(([k, l]) => `<button data-f="${k}" class="tabn ${k === filter ? 'on' : ''}">${l}${unreadOf(k) ? `<i>${unreadOf(k)}</i>` : ''}</button>`).join('');
    // list grouped by day
    let html = '', g = '', shown = 0;
    if (offerOn && (filter === 'all' || filter === 'system')) html += offerCard();
    items.forEach((n, i) => {
      if (filter !== 'all' && n.type !== filter) return;
      if (n.g !== g) { g = n.g; html += `<h3 class="gh">${g}</h3>`; }
      html += row(n, i); shown++;
    });
    if (!shown && !(offerOn && (filter === 'all' || filter === 'system'))) html = `<div class="flex flex-col items-center text-center pt-16">
      <img src="assets/icons/ghost-empty.webp" class="w-40 h-40 object-contain float" alt=""><h3 class="text-lg font-light mt-2">Nothing here yet</h3>
      <p class="text-xs text-gray-500 mt-1 max-w-[240px]">New calls, follows, gifts and offers will show up here.</p></div>`;
    document.getElementById('list').innerHTML = html;
    bindSwipe();
  }

  document.getElementById('tabs').onclick = e => { const b = e.target.closest('[data-f]'); if (b) { filter = b.dataset.f; render(); } };
  document.getElementById('list').addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (a) { const n = items[+a.dataset.act]; n.unread = false; if (n.act[1]) return vibe.go(n.act[1]); n.act = null; vibe.toast('Following back'); return render(); }
    const w = e.target.closest('.wrap');
    if (w && items[+w.dataset.i].unread) { items[+w.dataset.i].unread = false; render(); }
  });
  function readAll() { if (!unreadOf('all')) return; items.forEach(n => (n.unread = false)); render(); vibe.toast('All caught up'); }
  function dismissOffer() { offerOn = false; render(); }

  // swipe a row to the left to remove it
  function bindSwipe() {
    document.querySelectorAll('.wrap').forEach(w => {
      const it = w.querySelector('.item'); let sx = 0, dx = 0, on = false;
      it.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; on = true; sx = e.clientX; dx = 0; it.style.transition = 'none'; it.setPointerCapture(e.pointerId); });
      it.addEventListener('pointermove', e => { if (!on) return; dx = Math.min(0, e.clientX - sx); it.style.transform = `translateX(${dx}px)`; });
      const end = () => {
        if (!on) return; on = false; it.style.transition = '';
        if (dx < -90) { it.classList.add('leaving'); setTimeout(() => removeWithUndo(+w.dataset.i), 250); }
        else it.style.transform = '';
      };
      it.addEventListener('pointerup', end); it.addEventListener('pointercancel', end);
    });
  }
  // removed notification can be brought back for 5 seconds
  let lastRemoved = null, undoT;
  function removeWithUndo(i) {
    lastRemoved = { i, n: items[i] }; items.splice(i, 1); render();
    const u = document.getElementById('undo'); u.classList.remove('hidden'); u.classList.add('flex');
    clearTimeout(undoT); undoT = setTimeout(hideUndo, 5000);
  }
  function hideUndo() { const u = document.getElementById('undo'); u.classList.add('hidden'); u.classList.remove('flex'); lastRemoved = null; }
  function undoRemove() {
    if (!lastRemoved) return;
    items.splice(Math.min(lastRemoved.i, items.length), 0, lastRemoved.n); render(); clearTimeout(undoT); hideUndo();
  }
  render();
</script>
</body>
</html>
