<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VIBE · Chat</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="assets/theme.js"></script>
<script src="assets/demo-data.js"></script>
<script src="assets/safety.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .me { background: linear-gradient(135deg, #ff2a85, #c3157a 60%, #7a1fd1); border-radius: 18px 18px 6px 18px; }
  .them { background: #12121c; border: 1px solid #262636; border-radius: 18px 18px 18px 6px; }
  .bub { animation: in .25s ease-out both; } @keyframes in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  .typing i { display: inline-block; width: 6px; height: 6px; border-radius: 9px; background: #8b8b9a; margin: 0 1.5px; animation: t 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s } .typing i:nth-child(3) { animation-delay: .4s }
  @keyframes t { 0%,60%,100% { transform: translateY(0); opacity: .4 } 30% { transform: translateY(-4px); opacity: 1 } }
  .hdr-btn { width: 40px; height: 40px; border-radius: 99px; display: flex; align-items: center; justify-content: center; border: 1px solid #262636; background: #12121c; }
</style>
</head>
<body>
<main class="phone">
  <!-- header -->
  <header class="relative z-10 flex items-center gap-3 px-3 pt-4 pb-3 glass border-b border-cyberLine">
    <button onclick="history.length > 1 ? history.back() : vibe.go('14-chats.html')" class="w-9 h-9 flex items-center justify-center" aria-label="Back">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <a id="who" class="flex items-center gap-3 flex-1 min-w-0"></a>
    <button id="vBtn" class="hdr-btn text-onlineGreen" aria-label="Voice call"></button>
    <button id="cBtn" class="hdr-btn text-neonPink" aria-label="Video call"></button>
    <button onclick="openSheet()" class="w-8 h-10 flex items-center justify-center" aria-label="More"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </header>

  <!-- messages -->
  <section id="msgs" class="relative flex-1 overflow-y-auto px-4 py-4 flex flex-col gap-2"
    style="background: radial-gradient(circle at 85% 15%, rgba(255,42,133,.07), transparent 45%), radial-gradient(circle at 10% 85%, rgba(0,242,254,.05), transparent 45%)"></section>

  <!-- input -->
  <footer class="relative z-10 px-3 pt-2 pb-5 glass border-t border-cyberLine">
    <div class="flex items-center gap-2">
      <button onclick="vibe.toast('Photo picker opens here')" class="w-11 h-11 rounded-full btn-ghost flex items-center justify-center" aria-label="Photo">
        <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></button>
      <div class="flex-1 h-11 rounded-full neon-field flex items-center px-4"><input id="inp" class="bg-transparent outline-none flex-1 text-sm" placeholder="Type a message…" maxlength="500"></div>
      <button onclick="vibe.toast('Gift sheet (same as in calls)')" class="w-11 h-11 rounded-full btn-ghost flex items-center justify-center text-xl" aria-label="Gift">🎁</button>
      <button onclick="send()" class="w-11 h-11 rounded-full btn-neon flex items-center justify-center" aria-label="Send">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
    </div>
  </footer>

  <!-- more sheet -->
  <div id="more" class="sheet-wrap" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="sheet rounded-t-3xl bg-cyberCard border-t border-cyberLine p-5 pb-8" id="moreBody"></div>
  </div>
</main>

<script>
  // DEMO only. Real messages travel through the server (socket); the server also filters abuse/spam.
  const D = window.DEMO, $ = s => document.getElementById(s);
  const pid = new URLSearchParams(location.search).get('id') || '1';
  const team = pid === 'team';
  const h = team ? { id: 0, n: 'VIBE Team', s: 'ONLINE', grad: ['#ff2a85', '#00f2fe'], voice: false, video: false } : (D.hosts.find(x => x.id === +pid) || D.hosts[0]);
  const PH = c => `<svg class="${c}" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z"/></svg>`;
  const VID = c => `<svg class="${c}" viewBox="0 0 24 24" fill="currentColor"><path d="M5 5.5h8.5a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3z"/><path d="M17.5 10.2l3.4-2.3c.5-.3 1.1 0 1.1.6v6.9c0 .6-.6.9-1.1.6l-3.4-2.3z"/></svg>`;

  // header
  const status = () => h.s === 'ONLINE' ? '<span class="text-onlineGreen">Online</span>' : h.s === 'BUSY' ? '<span class="text-orange-300">On a call</span>' : 'Last seen 2h ago';
  $('who').innerHTML = `${team ? '<div class="w-11 h-11 rounded-full neon-border flex items-center justify-center shrink-0"><img src="assets/icons/home.webp" class="w-8 h-8" alt=""></div>'
      : `<div class="relative shrink-0">${D.avatar(h, 'w-11 h-11 rounded-full text-base')}${h.s !== 'OFFLINE' ? `<span class="absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-cyberDark" style="background:${D.status[h.s].dot}"></span>` : ''}</div>`}
    <div class="min-w-0"><div class="font-bold truncate">${h.n}</div><div class="text-xs text-gray-400" id="sub">${team ? 'Official · replies in ~10 min' : status()}</div></div>`;
  if (!team) $('who').href = `07-host-profile.html?id=${h.id}`;
  $('vBtn').innerHTML = PH('w-[18px] h-[18px]'); $('cBtn').innerHTML = VID('w-[18px] h-[18px]');
  if (!h.voice) $('vBtn').remove(); else $('vBtn').onclick = () => call('audio');
  if (!h.video) $('cBtn').remove(); else $('cBtn').onclick = () => call('video');
  function call(t) {
    if (h.s === 'BUSY') return vibe.toast(`${h.n} is on another call`);
    if (h.s === 'OFFLINE') return vibe.toast(`${h.n} is offline`);
    vibe.go(t === 'audio' ? `13-audio-call.html?id=${h.id}` : `09-outgoing-call.html?id=${h.id}`);
  }

  // message rendering
  const now = () => new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  function tick(state) { return state === 'seen' ? '<span class="text-neonCyan">✓✓</span>' : state === 'delivered' ? '<span class="text-white/70">✓✓</span>' : '<span class="text-white/70">✓</span>'; }
  function bubble(m) {
    if (m.t === 'note') return `<div class="bub self-center max-w-[92%] text-center text-[11px] text-gray-300 px-3 py-1.5 rounded-full bg-cyberCard/80 border border-cyberLine my-1">${m.html}</div>`;
    if (m.t === 'day') return `<div class="self-center text-[11px] text-gray-500 px-3 py-1 rounded-full bg-cyberCard my-2">${m.text}</div>`;
    if (m.t === 'safety') return `<div class="self-center max-w-[90%] text-center text-[11px] text-gray-400 px-4 py-2.5 rounded-2xl bg-cyberCard border border-cyberLine mb-2">🛡️ Never share OTPs, bank details or pay anyone outside VIBE. Report anyone who asks.</div>`;
    if (m.t === 'call') return `<div class="bub self-center flex items-center gap-2 px-4 py-2 rounded-full bg-cyberCard border border-cyberLine text-xs ${m.missed ? 'text-dangerRed' : 'text-gray-300'}">
      ${m.voice ? PH('w-3.5 h-3.5') : VID('w-3.5 h-3.5')} ${m.text}<span class="text-gray-500">· ${m.time}</span></div>`;
    if (m.t === 'gift') return `<div class="bub ${m.me ? 'self-end' : 'self-start'} flex items-center gap-3 px-4 py-3 rounded-2xl border border-cyberGold/40 bg-gradient-to-br from-yellow-900/30 to-cyberCard">
      <span class="text-3xl">${m.emoji}</span><div><div class="text-sm font-semibold">${m.me ? 'You sent' : `${h.n} sent`} a ${m.name}</div><div class="text-[11px] text-cyberGold flex items-center gap-1"><span class="coin w-3 h-3"></span>${m.price} coins · ${m.time}</div></div></div>`;
    if (m.t === 'photo') return `<div class="bub ${m.me ? 'self-end' : 'self-start'} w-48 h-56 rounded-2xl overflow-hidden relative" style="background:linear-gradient(160deg,${h.grad[0]},${h.grad[1]})">
      <span class="absolute inset-0 flex items-center justify-center text-5xl">📷</span><span class="absolute bottom-2 right-3 text-[10px] text-white/80">${m.time}</span></div>`;
    return `<div class="bub ${m.me ? 'self-end me' : 'self-start them'} max-w-[78%] px-4 py-2.5 text-sm leading-snug">
      ${m.text.replace(/</g, '&lt;')}<span class="ml-2 text-[10px] ${m.me ? 'text-white/70' : 'text-gray-500'} whitespace-nowrap align-bottom">${m.paid ? `−${m.paid} 🪙 · ` : ''}${m.time}${m.me ? ' ' + tick(m.state) : ''}</span></div>`;
  }
  const msgs = team ? [
    { t: 'day', text: 'Today' },
    { t: 'text', text: 'Welcome to VIBE! 💖 Here are 100 free coins to start.', time: '9:02 am' },
    { t: 'text', text: 'Tip: become a host from the Home screen and earn for every minute you talk.', time: '9:02 am' },
  ] : [
    { t: 'safety' }, { t: 'day', text: 'Yesterday' },
    { t: 'text', me: true, text: 'Hi Priya! Loved your playlist 🎵', time: '9:30 pm', state: 'seen' },
    { t: 'text', text: 'Haha thank you 😄 which song did you like?', time: '9:31 pm' },
    { t: 'call', voice: true, missed: true, text: 'Missed voice call', time: '9:41 pm' },
    { t: 'day', text: 'Today' },
    { t: 'gift', me: true, emoji: '🌹', name: 'Rose', price: 20, time: '1:58 pm' },
    { t: 'call', voice: false, text: 'Video call · 06:24', time: '2:10 pm' },
    { t: 'photo', time: '2:20 pm' },
    { t: 'text', text: 'Same!! Call karte hain? I\'m free for 20 min ☕', time: '2:21 pm' },
  ];
  // quick replies live inside the chat, under the last message (separate from the input bar)
  // [label html, message sent]
  const QUICK = [['👋 Hi', '👋 Hi'], ['How are you?', 'How are you?'],
    [`<span class="inline-flex items-center gap-1 text-onlineGreen">${PH('w-3 h-3')}<span class="text-white">Call?</span></span>`, 'Call?'],
    [`<span class="inline-flex items-center gap-1 text-neonPink">${VID('w-3.5 h-3.5')}<span class="text-white">Video?</span></span>`, 'Video call?'], ['😂', '😂']];
  // one line, swipe sideways for more
  const quickRow = () => `<div id="quick" class="flex justify-center gap-1.5 mt-2 shrink-0">${QUICK.map(([label, msg]) =>
    `<button data-msg="${msg}" class="chip shrink-0 whitespace-nowrap px-2.5 h-8 rounded-full text-[11px]">${label}</button>`).join('')}</div>`;
  function draw() { $('msgs').innerHTML = msgs.map(bubble).join('') + quickRow(); $('msgs').scrollTop = 1e6; }
  draw();
  $('msgs').addEventListener('click', e => { const b = e.target.closest('#quick button'); if (b) { $('inp').value = b.dataset.msg; send(); } });

  // paid chat (DEMO): first N messages to a host are free, then the host's own price per message.
  // Real app: the server counts, charges before saving, and pays the host. Host replies are always free.
  let balance = D.balance;
  let freeLeft = team ? Infinity : Math.max(0, D.freeMessages - msgs.filter(m => m.me && (m.t === 'text' || m.t === 'photo')).length);
  // price info is posted as small notes inside the chat, so it scrolls away with the messages
  const coinIc = '<span class="coin w-3.5 h-3.5 align-[-2px]"></span>';
  function note(html) { msgs.push({ t: 'note', html }); }
  function paintPrice() { $('inp').placeholder = 'Type a message…'; }
  if (!team) {
    note(freeLeft > 0
      ? `💬 <b class="text-onlineGreen">${freeLeft} free message${freeLeft > 1 ? 's' : ''}</b> left · then ${coinIc} <b class="text-cyberGold">${h.mp}</b> per message`
      : `${coinIc} <b class="text-cyberGold">${h.mp}</b> coins per message · set by ${h.n}`);
    draw();
  }
  paintPrice();

  // send: sent ✓ -> delivered ✓✓ -> seen (cyan) -> typing… -> reply (demo)
  function send() {
    const v = $('inp').value.trim(); if (!v) return;
    let paid = 0;
    if (!team && freeLeft <= 0) {
      if (balance < h.mp) { note(`Not enough coins · ${coinIc} <b class="text-cyberGold">${h.mp}</b> needed per message · <span class="text-neonPink font-semibold">Recharge</span>`); draw(); return; }
      balance -= h.mp; paid = h.mp;
    } else if (!team) freeLeft--;
    paintPrice();
    const m = { t: 'text', me: true, text: v, time: now(), state: 'sent', paid };
    msgs.push(m); $('inp').value = '';
    if (!team && !paid && freeLeft === 0) note(`Free messages used · each message now costs ${coinIc} <b class="text-cyberGold">${h.mp}</b> coins`);
    draw();
    setTimeout(() => { m.state = 'delivered'; draw(); }, 600);
    if (team || h.s === 'OFFLINE') return;
    setTimeout(() => { m.state = 'seen'; draw(); $('sub').innerHTML = '<span class="text-onlineGreen">typing…</span>';
      $('quick').insertAdjacentHTML('beforebegin', '<div id="typ" class="bub self-start them px-4 py-3"><span class="typing"><i></i><i></i><i></i></span></div>'); $('msgs').scrollTop = 1e6; }, 1300);
    setTimeout(() => { $('typ')?.remove(); $('sub').innerHTML = status();
      msgs.push({ t: 'text', text: ['Haha sahi 😂', 'Aur batao?', 'Call karo na 📞', '❤️'][Math.floor(Math.random() * 4)], time: now() }); draw(); }, 3000);
  }
  $('inp').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

  // "more" sheet: person header, 3 round quick actions, then a separate Block / Report section
  const SV = p => `<svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">${p}</svg>`;
  const IC = {
    user: SV('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
    bell: SV('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>'),
    bellOff: SV('<path d="M6 8a6 6 0 0 1 9.3-5M18 8c0 7 3 9 3 9H7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0M3 3l18 18"/>'),
    search: SV('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
    trash: SV('<path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/>'),
    ban: SV('<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>'),
    flag: SV('<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>'),
  };
  let muted = false;
  function openSheet() {
    const quick = (k, ic, label, on) => `<button onclick="act('${k}')" class="flex-1 flex flex-col items-center gap-2">
      <span class="w-14 h-14 rounded-full flex items-center justify-center border ${on ? 'bg-white text-cyberDark border-white' : 'border-white/15 text-gray-200'}">${ic}</span>
      <span class="text-[10px] tracking-[.14em] uppercase text-gray-400">${label}</span></button>`;
    const danger = (k, ic, title, sub) => `<button onclick="act('${k}')" class="w-full flex items-center gap-3 py-3.5 text-left">
      <span class="text-dangerRed">${ic}</span><span class="flex-1"><span class="block text-[15px] text-dangerRed">${title}</span><span class="block text-xs text-gray-500">${sub}</span></span></button>`;
    $('moreBody').innerHTML = `<div>
      <div class="w-10 h-1 rounded-full bg-white/15 mx-auto mb-5"></div>
      <div class="flex items-center gap-3 mb-6">
        ${team ? '<div class="w-12 h-12 rounded-full neon-border flex items-center justify-center"><img src="assets/icons/home.webp" class="w-8 h-8" alt=""></div>' : D.avatar(h, 'w-12 h-12 rounded-full text-lg')}
        <div class="flex-1 min-w-0"><div class="font-semibold truncate">${h.n}</div><div class="text-xs text-gray-400">${team ? 'Official account' : h.s === 'ONLINE' ? 'Online now' : h.s === 'BUSY' ? 'On a call' : 'Offline'}</div></div>
        ${team ? '' : `<button onclick="act('profile')" class="h-9 px-4 rounded-full border border-white/20 text-xs tracking-wide flex items-center gap-1.5">${IC.user.replace('w-[22px] h-[22px]', 'w-4 h-4')}Profile</button>`}
      </div>
      <div class="flex gap-2 mb-5">
        ${quick('mute', muted ? IC.bellOff : IC.bell, muted ? 'Unmute' : 'Mute', muted)}
        ${quick('search', IC.search, 'Search', false)}
        ${quick('clear', IC.trash, 'Clear', false)}
      </div>
      ${team ? '' : `<div class="border-t border-white/10 pt-1">
        ${danger('block', IC.ban, 'Block ' + h.n, "They can't message or call you")}
        ${danger('report', IC.flag, 'Report', 'Tell our safety team what went wrong')}
      </div>`}
    </div>`;
    $('more').classList.add('open');
  }
  function act(k) {
    $('more').classList.remove('open');
    if (k === 'profile') return vibe.go(`07-host-profile.html?id=${h.id}`);
    if (k === 'mute') { muted = !muted; return vibe.toast(muted ? 'Notifications muted' : 'Notifications on'); }
    if (k === 'search') return vibe.toast('Search in this chat');
    if (k === 'clear') { msgs.length = 0; draw(); return vibe.toast('Chat cleared'); }
    if (k === 'block') SAFETY.confirmBlock(h.id, h.n, () => setTimeout(() => vibe.go('14-chats.html'), 700)); else vibe.go('36-report-user.html?id=' + h.id);
  }
</script>
</body>
</html>
