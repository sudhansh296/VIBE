<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VIBE · Settings</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="assets/theme.js"></script>
<script src="assets/safety.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .grp { border: 1px solid #262636; background: #12121c; border-radius: 20px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; text-align: left; }
  .row + .row { border-top: 1px solid #1c1c28; }
  .ico { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid; }
  .ico svg { width: 18px; height: 18px; }
  .h { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #6b6b7b; margin: 22px 0 8px 4px; }
  .sw { width: 50px; height: 30px; border-radius: 99px; background: #2a2a3a; position: relative; flex-shrink: 0; transition: background .2s; }
  .sw::after { content: ''; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 99px; background: #fff; transition: transform .2s; }
  .sw.on { background: linear-gradient(135deg, #3ee08f, #0ea5a0); } .sw.on::after { transform: translateX(20px); }
</style>
</head>
<body>
<main class="phone">
  <div class="blob w-72 h-72 bg-neonCyan/10 -top-24 -right-24"></div>

  <header class="relative flex items-center gap-3 px-4 pt-5 pb-2">
    <button onclick="history.length > 1 ? history.back() : vibe.go('17-me.html')" class="w-10 h-10 rounded-full btn-ghost flex items-center justify-center" aria-label="Back">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 class="text-xl font-semibold">Settings</h1>
  </header>

  <section id="list" class="relative flex-1 overflow-y-auto px-5 pb-8"></section>

  <!-- sign out sheet -->
  <div id="sw" class="sheet-wrap" onclick="if(event.target===this)closeSheet()">
    <div class="sheet glass rounded-t-3xl p-6 border-t border-cyberLine">
      <h3 class="text-lg font-semibold text-center">Sign out?</h3>
      <p class="text-sm text-gray-400 text-center mt-2">You will need to log in again with your phone or Google.</p>
      <div class="grid grid-cols-2 gap-3 mt-6">
        <button onclick="closeSheet()" class="h-12 rounded-2xl btn-ghost font-semibold">Cancel</button>
        <button onclick="vibe.toast('Signed out');setTimeout(()=>vibe.go('02-login.html'),700)" class="h-12 rounded-2xl btn-neon font-bold">Sign out</button>
      </div>
    </div>
  </div>
</main>
<script>
  // DEMO values. Phone, login type, block count, host status and the app version come from the server / device.
  const isHost = true;   // flip to see the user-only version of this screen
  const S = { msgs: true, missed: true, offers: false, online: true, visitors: true };
  const I = {
    edit: '<svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="M13 7l4 4"/></svg>',
    phone: '<svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg>',
    key: '<svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
    bank: '<svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 10 12 4l9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/></svg>',
    sliders: '<svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
    chat: '<svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>',
    miss: '<svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/><path d="m16 3 5 5M21 3l-5 5"/></svg>',
    gift: '<svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>',
    eye: '<svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
    dot: '<svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24"><path d="M14.5 12a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Z"/><path d="M7.5 7.5a6.4 6.4 0 0 0 0 9M16.5 7.5a6.4 6.4 0 0 1 0 9"/></svg>',
    ban: '<svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></svg>',
    globe: '<svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
    help: '<svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg>',
    doc: '<svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>',
    out: '<svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
    trash: '<svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>',
  };
  const T = { pink: 'border-color:rgba(255,42,133,.4);background:rgba(255,42,133,.1);color:#ff2a85', cyan: 'border-color:rgba(0,242,254,.4);background:rgba(0,242,254,.1);color:#00f2fe', gold: 'border-color:rgba(246,220,155,.4);background:rgba(246,220,155,.1);color:#f6dc9b', green: 'border-color:rgba(62,224,143,.4);background:rgba(62,224,143,.1);color:#3ee08f', grey: 'border-color:rgba(255,255,255,.15);color:#d1d5db', red: 'border-color:rgba(255,77,94,.4);background:rgba(255,77,94,.1);color:#ff4d5e' };
  const chev = '<span class="text-gray-600">›</span>';
  const link = (id, icon, tone, title, val, sub) => `<button class="row" data-go="${id}"><span class="ico" style="${T[tone]}">${I[icon]}</span><span class="flex-1"><span class="block text-[15px]">${title}</span>${sub ? `<span class="text-[11px] text-gray-500">${sub}</span>` : ''}</span>${val ? `<span class="text-xs text-gray-500">${val}</span>` : ''}${chev}</button>`;
  const toggle = (k, icon, tone, title, sub) => `<div class="row"><span class="ico" style="${T[tone]}">${I[icon]}</span><span class="flex-1"><span class="block text-[15px]">${title}</span>${sub ? `<span class="text-[11px] text-gray-500">${sub}</span>` : ''}</span><button class="sw ${S[k] ? 'on' : ''}" data-t="${k}" aria-label="${title}"></button></div>`;

  function paint() {
    const keep = document.getElementById('list').scrollTop;
    document.getElementById('list').innerHTML = `
      <div class="h">Account</div><div class="grp">
        ${link('27-edit-profile.html', 'edit', 'pink', 'Edit profile', '')}
        ${link('49-change-phone.html', 'phone', 'cyan', 'Phone number', '+91 98••••4321')}
        ${link('', 'key', 'gold', 'Login', 'Phone')}
      </div>
      ${isHost ? `<div class="h">Host</div><div class="grp">
        ${link('25-host-rates.html', 'sliders', 'pink', 'Call settings', 'Rates · voice / video')}
        ${link('26-withdraw.html', 'bank', 'gold', 'UPI & PAN', 'priya@okaxis')}
        ${link('26-withdraw.html', 'bank', 'green', 'Withdrawals', '')}
      </div>` : ''}
      <div class="h">Notifications</div><div class="grp">
        ${toggle('msgs', 'chat', 'cyan', 'Messages')}
        ${toggle('missed', 'miss', 'pink', 'Missed calls')}
        ${toggle('offers', 'gift', 'gold', 'Offers & rewards')}
      </div>
      <div class="h">Privacy & safety</div><div class="grp">
        ${toggle('online', 'dot', 'green', 'Show my online status', 'Others see when you are online')}
        ${toggle('visitors', 'eye', 'cyan', 'Show me in visitors', 'People you view can see you visited')}
        ${link('', 'ban', 'red', 'Blocked users', String(SAFETY.list().length)).replace('data-go=""', 'data-go="37-blocked-users.html"')}
        ${link('41-safety-center.html', 'help', 'cyan', 'Safety center', '')}
      </div>
      <div class="h">General</div><div class="grp">
        ${link('48-language.html', 'globe', 'cyan', 'Language', 'English')}
        ${link('29-help.html', 'help', 'green', 'Help & support', '')}
        ${link('38-terms.html', 'doc', 'grey', 'Terms of Service', '')}
        ${link('39-privacy.html', 'doc', 'grey', 'Privacy Policy', '')}
        ${link('40-guidelines.html', 'doc', 'grey', 'Community guidelines', '')}
      </div>
      <div class="grp mt-6">
        <button class="row" data-out><span class="ico" style="${T.grey}">${I.out}</span><span class="flex-1 text-[15px]">Sign out</span></button>
        <button class="row" data-go="31-delete-account.html"><span class="ico" style="${T.red}">${I.trash}</span><span class="flex-1 text-[15px] text-dangerRed">Delete account</span></button>
      </div>
      <p class="text-[11px] text-gray-600 text-center mt-6">VIBE · version 1.0.0</p>`;
    document.getElementById('list').scrollTop = keep;
  }
  document.getElementById('list').onclick = e => {
    const t = e.target.closest('[data-t]'); if (t) { S[t.dataset.t] = !S[t.dataset.t]; return paint(); }   // the server stores these preferences
    if (e.target.closest('[data-out]')) return document.getElementById('sw').classList.add('open');
    const g = e.target.closest('[data-go]'); if (g) g.dataset.go ? vibe.go(g.dataset.go) : vibe.toast('Coming with the backend');
  };
  function closeSheet() { document.getElementById('sw').classList.remove('open'); }
  paint();
</script>
</body>
</html>
