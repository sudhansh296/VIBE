<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBE · B1 colours + B3 UI</title>

<script>// Icon set for the call-me edition: clean rounded outline glyphs, 2px stroke, drawn in code (no image files).
// Usage: IC('home', 'w-6 h-6')  ->  <svg> markup with currentColor.
window.IC = (name, cls = 'ico') => {
  const I = {
    home: '<path d="M3.5 10.8 12 3.6l8.5 7.2"/><path d="M5.5 9.6V19a1.5 1.5 0 0 0 1.5 1.5h3.2v-5.2h3.6v5.2H17a1.5 1.5 0 0 0 1.5-1.5V9.6"/>',
    bolt: '<path d="M13 2.8 5 13.2h6.2L10.4 21.2 19 10.4h-6.3Z"/>',
    chat: '<path d="M5.5 4.5h13A2.5 2.5 0 0 1 21 7v8.2a2.5 2.5 0 0 1-2.5 2.5H11l-4.6 3.3v-3.3H5.5A2.5 2.5 0 0 1 3 15.2V7a2.5 2.5 0 0 1 2.5-2.5Z"/><path d="M8 9.3h8M8 12.6h5"/>',
    wallet: '<rect x="3" y="5.5" width="18" height="14.5" rx="3.2"/><path d="M3 10h18"/><circle cx="16.6" cy="14.8" r="1.1" fill="currentColor"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4.2 20.5c.6-3.6 3.7-5.5 7.8-5.5s7.2 1.9 7.8 5.5"/>',
    video: '<rect x="2.5" y="6" width="13" height="12" rx="3.2" fill="currentColor"/><path fill="currentColor" d="m15.5 10.3 4.9-2.7a.7.7 0 0 1 1.1.6v7.6a.7.7 0 0 1-1.1.6l-4.9-2.7Z"/>',
    heart: '<path d="M12 20.2S3.8 15.2 3.8 9.3A4.6 4.6 0 0 1 12 6.8a4.6 4.6 0 0 1 8.2 2.5c0 5.9-8.2 10.9-8.2 10.9Z"/>',
    bell: '<path d="M6.2 16.2V11a5.8 5.8 0 0 1 11.6 0v5.2l1.7 1.8H4.5Z"/><path d="M10 20.6h4"/>',
    search: '<circle cx="10.6" cy="10.6" r="6.4"/><path d="m20 20-4.9-4.9"/>',
    filter: '<path d="M4 7h9M18 7h2M4 17h2M11 17h9"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="8.5" cy="17" r="2.3"/>',
    star: '<path d="m12 3.2 2.7 5.5 6 .9-4.4 4.2 1 6-5.3-2.8-5.3 2.8 1-6L3.3 9.6l6-.9Z"/>',
    lock: '<rect x="4.8" y="10.8" width="14.4" height="10" rx="3"/><path d="M8 10.8V8.2a4 4 0 0 1 8 0v2.6"/>',
    shield: '<path d="M12 3 5 5.8v6c0 4.4 3 7.5 7 9.2 4-1.7 7-4.8 7-9.2v-6Z"/><path d="m9 12 2.3 2.3L15.5 10"/>',
    check: '<path d="m5 12.6 4.4 4.4L19 7.6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    close: '<path d="m6 6 12 12M18 6 6 18"/>',
    back: '<path d="m14.5 5.5-6.5 6.5 6.5 6.5"/>',
    chev: '<path d="m9.5 5.5 6.5 6.5-6.5 6.5"/>',
    end: '<path d="M2.8 14.4C6.6 10.6 17.4 10.6 21.2 14.4a1.5 1.5 0 0 1 0 2.1l-1.2 1.2a1.4 1.4 0 0 1-1.7.2l-2.2-1.3a1.4 1.4 0 0 1-.7-1.2v-1.4a9.3 9.3 0 0 0-4.8 0v1.4a1.4 1.4 0 0 1-.7 1.2l-2.2 1.3a1.4 1.4 0 0 1-1.7-.2L2.8 16.5a1.5 1.5 0 0 1 0-2.1Z"/>',
    mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.2a6.5 6.5 0 0 0 13 0M12 17.7v3.3"/>',
    micoff: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.2a6.5 6.5 0 0 0 13 0M12 17.7v3.3M4 4l16 16"/>',
    flip: '<path d="M4 9a8.2 8.2 0 0 1 14.3-2.3M20 4.8v3.4h-3.4"/><path d="M20 15a8.2 8.2 0 0 1-14.3 2.3M4 19.2v-3.4h3.4"/>',
    gift: '<rect x="3.5" y="8" width="17" height="4" rx="1.2"/><path d="M5 12v7a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-7M12 8v12.5"/><path d="M12 8C10.6 4.4 6.6 4.4 7 6.6c.3 1.6 3 1.4 5 1.4Zm0 0c1.4-3.6 5.4-3.6 5-1.4-.3 1.6-3 1.4-5 1.4Z"/>',
    send: '<path d="M21 3.5 3.5 10.2l6.6 3 3 6.6Z"/><path d="m10.1 13.2 4.6-4.6"/>',
    pin: '<path d="M12 21s-6.8-5.6-6.8-11a6.8 6.8 0 0 1 13.6 0c0 5.4-6.8 11-6.8 11Z"/><circle cx="12" cy="10" r="2.5"/>',
    crown: '<path d="m3.5 8 4.3 4 4.2-6.5 4.2 6.5 4.3-4-1.5 10.5h-14Z"/>',
    gear: '<path d="M4 7h9M18 7h2M4 17h2M11 17h9"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="8.5" cy="17" r="2.3"/>',
    cam: '<path d="M8.6 4.5h6.8l1.4 2H20a1.8 1.8 0 0 1 1.8 1.8v9.9A1.8 1.8 0 0 1 20 20H4a1.8 1.8 0 0 1-1.8-1.8V8.3A1.8 1.8 0 0 1 4 6.5h3.2Z"/><circle cx="12" cy="13" r="3.6"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5.3l3.4 2"/>',
  };
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[name] || I.star}</svg>`;
};
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root { --bg: #fff5f8; --card: #ffffff; --ln: #ffe0ea; --p1: #ff4d8d; --p2: #ff7ab0; --tx: #2a1520; --dim: #7e6070; --mut: #b79aa7; --gold: #c98a0b; --green: #12a150; --red: #e5384f; }
  body { font-family: 'Inter', sans-serif; background: #1a1017; color: #fff; margin: 0; padding: 26px 16px 60px; }
  .wrap { max-width: 1300px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 30px; margin-top: 24px; }
  .lab { font-weight: 800; font-size: 14px; margin: 0 0 10px 6px; color: #ffd0e2; }
  .ph { position: relative; width: 100%; max-width: 340px; height: 680px; margin: 0 auto; border-radius: 34px; overflow: hidden; background: var(--bg); color: var(--tx); border: 7px solid #2b1a24; box-shadow: 0 30px 60px -30px #ff4d8d; font-size: 12px; }
  .abs { position: absolute; } .row { display: flex; align-items: center; } .col { display: flex; flex-direction: column; }
  .sb { height: 26px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 11px; font-weight: 700; }
  .glow { position: absolute; border-radius: 99px; filter: blur(70px); pointer-events: none; }
  .coin { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 99px; flex-shrink: 0; background: radial-gradient(circle at 32% 28%, #fff7d6, #f6c75e 48%, #b07a12); font-size: 10px; font-weight: 900; color: #5a3a00; }
  .logo { font-size: 24px; font-weight: 900; letter-spacing: -.5px; background: linear-gradient(90deg, var(--p1), var(--p2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-size: 10px; font-weight: 800; }
  .wpill { background: #fff; box-shadow: 0 4px 10px -4px rgba(255,77,141,.4); }
  .dg { width: 6px; height: 6px; border-radius: 99px; background: #19b562; }
  .chip { height: 29px; padding: 0 13px; border-radius: 99px; display: inline-flex; align-items: center; font-weight: 700; font-size: 11.5px; background: #fff; color: #a77a92; border: 1px solid var(--ln); }
  .chip.on { background: #ffe3ef; color: var(--p1); border: 1.5px solid var(--p1); }
  .btnp { display: flex; align-items: center; justify-content: center; gap: 7px; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--p1), var(--p2)); box-shadow: 0 10px 22px -8px var(--p1); }
  .shadowc { box-shadow: 0 12px 28px -18px rgba(255,77,141,.6); }
  /* B3 poster card */
  .pc { position: relative; aspect-ratio: .8; border-radius: 24px; overflow: hidden; color: #fff; box-shadow: 0 10px 24px -12px #ff4d8d; }
  .pc .wm { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 82px; font-weight: 900; color: rgba(255,255,255,.42); padding-bottom: 22px; }
  .pc .sh { position: absolute; inset: 0; background: linear-gradient(transparent 52%, rgba(214,40,100,.42)); }
  /* footer: white pill, raised pink centre */
  .nav { position: absolute; left: 14px; right: 14px; bottom: 14px; height: 60px; border-radius: 26px; background: #fff; border: 1px solid var(--ln); box-shadow: 0 14px 30px -10px rgba(255,77,141,.5); display: flex; align-items: center; z-index: 6; }
  .nav .it { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 9.5px; font-weight: 700; color: var(--mut); } .nav .it svg { width: 22px; height: 22px; } .nav .it.on { color: var(--p1); }
  .nav .mid { width: 78px; position: relative; height: 100%; } .nav .mid i { position: absolute; left: 50%; top: -24px; transform: translateX(-50%); width: 60px; height: 60px; border-radius: 99px; background: linear-gradient(135deg, var(--p1), var(--p2)); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 5px #fff5f8, 0 12px 24px -6px var(--p1); } .nav .mid svg { width: 27px; height: 27px; }
  .navfade { position: absolute; left: 0; right: 0; bottom: 0; height: 110px; background: linear-gradient(transparent, #fff5f8 45%); z-index: 5; }
  .match { position: absolute; left: 50%; transform: translateX(-50%); bottom: 104px; z-index: 6; padding: 6px 16px 6px 6px; border-radius: 99px; font-weight: 800; font-size: 12px; display: flex; align-items: center; gap: 8px; color: #fff; background: linear-gradient(90deg, var(--p1), var(--p2)); box-shadow: 0 10px 24px -8px var(--p1); white-space: nowrap; }
  .match .b { width: 28px; height: 28px; border-radius: 99px; background: #fff; color: var(--p1); display: flex; align-items: center; justify-content: center; }
  .sec { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--mut); font-weight: 700; margin: 14px 14px 8px; }
  .sheetc { background: #fff; border: 1px solid var(--ln); border-radius: 20px; }
  .w-3{width:12px;height:12px}.w-4{width:16px;height:16px}.w-5{width:20px;height:20px}.w-6{width:24px;height:24px}.w-7{width:28px;height:28px}.h-3,.h-4,.h-5,.h-6,.h-7{flex-shrink:0}
  .pill{white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <h1 style="font-size:30px;font-weight:900;background:linear-gradient(90deg,#ff4d8d,#ffc2dd);-webkit-background-clip:text;background-clip:text;color:transparent">VIBE · B1 colours + B3 UI</h1>
  <p style="color:#c9a8b8;margin-top:6px">B1 (Blush) ke color aur light theme, B3 (Candy Poster) ka UI: pink poster cards, safed pills, ubhra hua pink centre button wala footer. Sirf dekhne ke liye, app mein abhi kuch nahi badla. 6 screens:</p>
  <div class="grid" id="grid"></div>
</div>

<script>
  const C = '<span class="coin">V</span>';
  const V = (c = 'w-5 h-5') => IC('video', c);
  const sb = (c = 'var(--tx)') => `<div class="sb" style="color:${c}"><span>9:41</span><span>5G ▮▮▮</span></div>`;
  const G = [['#ff9ec3', '#ff4d8d'], ['#ffb3cf', '#ff7ab0'], ['#ff8fb8', '#f0447f'], ['#ffc2dd', '#ff6fa3']];
  const HOSTS = [['Priya', 24, 'Mumbai', 60, 'Online'], ['Arjun', 26, 'Delhi', 50, 'Online'], ['Ananya', 22, 'Bangalore', 80, 'Online'], ['Diya', 23, 'Chennai', 60, 'Busy']];
  const nav = (on) => `<div class="navfade"></div><div class="nav"><div class="it ${on === 0 ? 'on' : ''}" style="flex:1">${IC('home')}Home</div><div class="mid"><i>${IC('chat')}</i></div><div class="it ${on === 2 ? 'on' : ''}" style="flex:1">${IC('user')}Me</div></div>`;
  const TOPG = `<div class="glow" style="width:260px;height:260px;right:-90px;top:-90px;background:#ff9ec3;opacity:.45"></div>`;

  const S = {};
  /* 1 HOME */
  S.home = ['1 · Home', `${TOPG}${sb()}
    <div class="row" style="padding:6px 14px;gap:8px;position:relative"><span class="logo" style="flex:1">VIBE</span><span class="pill wpill" style="color:var(--gold);height:30px">${C} 2,850</span><span class="row" style="width:30px;height:30px;border-radius:10px;background:#fff;justify-content:center;border:1px solid var(--ln);color:var(--dim)">${IC('bell', 'w-4 h-4')}</span></div>
    <div class="row" style="gap:22px;padding:2px 16px 6px;font-weight:800;font-size:15px;color:var(--mut);position:relative"><span style="color:var(--tx);position:relative">Discover<i style="position:absolute;left:0;right:0;bottom:-5px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--p1),var(--p2))"></i></span><span>Following</span><span>New</span></div>
    <div class="row" style="gap:6px;padding:8px 14px;position:relative"><span class="chip on">All</span><span class="chip">Girls</span><span class="chip">Boys</span><span class="chip">Online now</span></div>
    <div class="row" style="gap:12px;padding:2px 14px 8px;position:relative">${['S', 'P', 'A', 'K', 'D'].map((l, i) => `<div style="width:46px;height:46px;border-radius:99px;padding:2.5px;${i ? 'background:linear-gradient(135deg,#ff4d8d,#ff7ab0)' : 'border:1.5px dashed #ff9ec3'}"><span class="row" style="width:100%;height:100%;border-radius:99px;justify-content:center;font-weight:800;background:#fff;border:2px solid #fff5f8;color:var(--p1)">${l}</span></div>`).join('')}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 14px;position:relative">${HOSTS.map((h, i) => `<div class="pc" style="background:linear-gradient(150deg,${G[i][0]},${G[i][1]})"><span class="wm">${h[0][0]}</span><span class="sh"></span>
      <span class="pill abs wpill" style="top:8px;left:8px;color:var(--green)"><i class="dg" ${h[4] == 'Busy' ? 'style="background:#fb923c"' : ''}></i>${h[4]}</span><span class="pill abs wpill" style="top:8px;right:8px;color:var(--gold)">${C.replace('20px', '14px')} ${h[3]}</span>
      <div class="abs" style="left:10px;bottom:9px;font-weight:900;font-size:13.5px;line-height:1.15">${h[0]}, ${h[1]}<div style="font-size:10.5px;font-weight:500;opacity:.9">${h[2]}</div></div>
      <span class="abs row" style="right:8px;bottom:8px;width:38px;height:38px;border-radius:99px;background:#fff;color:#ff4d8d;box-shadow:0 6px 14px -6px #a20f62;justify-content:center">${V('w-5 h-5')}</span></div>`).join('')}</div>
    <div class="match"><span class="b">${IC('bolt', 'w-4 h-4')}</span>Random match</div>${nav(0)}`];

  /* 2 HOST PROFILE */
  S.profile = ['2 · Host profile', `<div class="abs" style="left:0;right:0;top:0;height:330px;background:linear-gradient(160deg,#ff2d87,#c4106a)"></div><span class="abs" style="left:0;right:0;top:20px;text-align:center;font-size:170px;font-weight:900;color:rgba(255,255,255,.25)">A</span>
    <div class="abs" style="left:0;right:0;top:0;height:330px;background:linear-gradient(transparent 55%,rgba(120,0,60,.35))"></div>${sb('#fff')}
    <div class="row abs" style="left:14px;right:14px;top:34px;justify-content:space-between"><span class="row wpill" style="width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.9);justify-content:center;color:var(--p1)">${IC('chev', 'w-5 h-5').replace('<svg', '<svg style="transform:rotate(180deg)"')}</span><span class="row" style="gap:8px"><span class="pill wpill" style="color:var(--green)"><i class="dg"></i>ONLINE</span></span></div>
    <div class="row abs" style="left:14px;top:84px;gap:6px"><span class="pill wpill" style="color:var(--p1)">${IC('video', 'w-3 h-3')} Intro video · 0:18</span></div>
    <div class="row abs" style="left:14px;top:280px;gap:7px">${[0, 1, 2, 3, 4].map(i => `<span style="width:46px;height:46px;border-radius:14px;border:2px solid ${i ? 'transparent' : '#fff'};background:linear-gradient(150deg,${G[i % 4][0]},${G[i % 4][1]});opacity:${i < 3 ? 1 : .7}"></span>`).join('')}</div>
    <div class="abs sheetc" style="left:0;right:0;top:346px;bottom:0;border-radius:30px 30px 0 0;padding:16px 16px 90px;overflow:hidden">
      <div class="row" style="gap:8px"><div style="flex:1"><div style="font-size:22px;font-weight:900;display:flex;align-items:center;gap:6px">Ananya <span style="color:var(--p1)">${IC('check', 'w-4 h-4')}</span></div><div style="font-size:11px;color:var(--mut)">ID: 40362383</div></div><span class="btnp" style="height:38px;padding:0 18px;border-radius:99px;font-size:12px">+ Follow</span></div>
      <div class="row" style="gap:6px;margin-top:10px;flex-wrap:wrap"><span class="pill" style="background:#ffe3ef;color:var(--p1)">22</span><span class="pill" style="background:#fff0f6;color:var(--dim)">Bangalore</span><span class="pill" style="background:#fff0f6;color:var(--gold)">Lv.15</span><span class="pill" style="background:#fff0d6;color:var(--gold)">VIP</span></div>
      <div class="row" style="gap:8px;margin-top:12px">${[['21k', 'Followers'], ['5,120', 'Calls'], ['98%', 'Answer']].map(s => `<div class="col" style="flex:1;align-items:center;padding:10px 0;border-radius:16px;background:#fff0f6"><b style="font-size:15px">${s[0]}</b><span style="font-size:10px;color:var(--mut)">${s[1]}</span></div>`).join('')}</div>
      <div style="margin-top:12px;padding:12px;border-radius:16px;background:#fff0f6;color:var(--dim);font-size:12px">Dancer. Ask me about K-dramas.</div></div>
    <div class="abs row" style="left:14px;right:14px;bottom:14px;gap:10px;z-index:6"><span class="row" style="width:54px;height:54px;border-radius:18px;background:#fff;border:1px solid var(--ln);justify-content:center;color:var(--p1)">${IC('chat', 'w-6 h-6')}</span><span class="btnp" style="flex:1;height:54px;border-radius:18px;font-size:14px">${V('w-6 h-6')}Video call · ${C.replace('20px', '16px')} 80</span></div>`];

  /* 3 WALLET */
  S.wallet = ['3 · Wallet', `${TOPG}${sb()}
    <div class="row" style="padding:8px 14px;gap:10px;position:relative"><span class="row" style="width:36px;height:36px;border-radius:12px;background:#fff;border:1px solid var(--ln);justify-content:center;color:var(--p1)">${IC('back', 'w-5 h-5')}</span><b style="font-size:18px">Wallet</b></div>
    <div style="margin:6px 14px;padding:18px;border-radius:26px;background:linear-gradient(135deg,#ff2d87,#ff7ab0);color:#fff;position:relative;overflow:hidden;box-shadow:0 16px 30px -14px #ff2d87"><div class="abs" style="right:-30px;top:-30px;width:130px;height:130px;border-radius:99px;background:rgba(255,255,255,.18)"></div>
      <div style="font-size:10px;letter-spacing:.14em;opacity:.85">COIN BALANCE</div><div class="row" style="gap:8px;margin-top:4px"><span class="coin" style="width:34px;height:34px;font-size:16px">V</span><b style="font-size:34px;font-weight:900">2,850</b></div><div style="font-size:11px;opacity:.85;margin-top:6px">About 47 min of video calls</div></div>
    <div class="row" style="gap:6px;margin:12px 14px 2px;padding:10px 12px;border-radius:16px;background:#e6f8ee;color:var(--green);font-weight:700">${IC('star', 'w-4 h-4')} First recharge bonus: +50% extra coins</div>
    <div class="sec">Choose a pack</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;padding:0 14px">${[['600', '₹49'], ['1,500', '₹99', 'Popular'], ['3,500', '₹199', 'sel'], ['8,000', '₹399'], ['18,000', '₹799', 'Best'], ['40,000', '₹1599']].map(p => `<div style="position:relative;text-align:center;padding:14px 4px 10px;border-radius:18px;background:#fff;border:1.5px solid ${p[2] == 'sel' ? 'var(--p1)' : 'var(--ln)'};${p[2] == 'sel' ? 'background:#fff0f6;box-shadow:0 10px 20px -12px #ff4d8d' : ''}">${p[2] && p[2] != 'sel' ? `<span class="pill abs btnp" style="top:-8px;left:50%;transform:translateX(-50%);padding:2px 8px;font-size:8.5px;box-shadow:none">${p[2]}</span>` : ''}<span class="coin" style="width:26px;height:26px;font-size:13px">V</span><div style="font-weight:900;color:var(--gold);margin-top:4px">${p[0]}</div><div style="font-size:10.5px;color:var(--mut)">${p[1]}</div></div>`).join('')}</div>
