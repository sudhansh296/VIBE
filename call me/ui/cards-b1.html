<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VIBE · Card options</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}:root{--p1:#ff4d8d;--p2:#ff7ab0;--ln:#ffe0ea;--tx:#2a1520;--dim:#7e6070;--gold:#c98a0b;--green:#12a150}
body{font-family:Inter,sans-serif;background:#1a1017;color:#fff;margin:0;padding:24px 14px 60px}
h1{font-size:26px;font-weight:900;background:linear-gradient(90deg,#ff4d8d,#ffc2dd);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:26px;margin-top:20px;max-width:1300px}
.lab{font-weight:800;margin:0 0 8px 6px;color:#ffd0e2}
.ph{width:100%;max-width:340px;border-radius:30px;background:#fff5f8;color:var(--tx);padding:14px;border:7px solid #2b1a24}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.coin{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:99px;background:radial-gradient(circle at 32% 28%,#fff7d6,#f6c75e 48%,#b07a12);font-size:9px;font-weight:900;color:#5a3a00}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-size:10px;font-weight:800;background:#fff}
.dg{width:6px;height:6px;border-radius:99px;background:#19b562}
.cb{width:36px;height:36px;border-radius:99px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px -6px var(--p1);flex-shrink:0}
.cb svg{width:19px;height:19px}
.card{position:relative;overflow:hidden;border-radius:24px}
.orb{position:absolute;border-radius:99px}
.av{border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff}
.abs{position:absolute}
</style></head><body>
<h1>Card options (blush theme)</h1><p style="color:#c9a8b8">Sirf card ke 4 options. Pasand wala bata do.</p>
<div class="g" id="g"></div>
<script>
const V='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h7A2.5 2.5 0 0 1 16 6.5V9l4-2.5v11L16 15v2.5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 4 17.5z"/></svg>';
const G=[['#ff2d87','#c4106a'],['#ff6fb0','#e0338a'],['#ff4fa0','#a20f62'],['#ff8fc4','#d63384']];
const H=[['Priya',24,'Mumbai',60,'Online'],['Arjun',26,'Delhi',50,'Online'],['Ananya',22,'Bangalore',80,'Online'],['Diya',23,'Chennai',60,'Busy']];
const dot=h=>h[4]=='Busy'?'style="background:#fb923c"':'';
const st=h=>`<span class="pill" style="color:var(--green)"><i class="dg" ${dot(h)}></i>${h[4]}</span>`;
const pr=h=>`<span class="pill" style="color:var(--gold)"><span class="coin">V</span>${h[3]}</span>`;
const opts={
 '1 · Orbs + avatar':(h,i)=>`<div class="card" style="aspect-ratio:.78;background:linear-gradient(150deg,${G[i][0]},${G[i][1]})">
  <i class="orb" style="width:120px;height:120px;right:-30px;top:-30px;background:rgba(255,255,255,.18)"></i><i class="orb" style="width:90px;height:90px;left:-30px;bottom:30px;background:rgba(255,255,255,.12)"></i>
  <div class="abs" style="left:10px;top:10px">${st(h)}</div><div class="abs" style="right:10px;top:10px">${pr(h)}</div>
  <div class="av abs" style="left:50%;top:44%;transform:translate(-50%,-50%);width:74px;height:74px;font-size:30px;background:rgba(255,255,255,.28);border:3px solid rgba(255,255,255,.85)">${h[0][0]}</div>
  <div class="abs" style="left:8px;right:8px;bottom:8px;background:rgba(255,255,255,.95);border-radius:18px;padding:8px 8px 8px 12px;display:flex;align-items:center;gap:6px"><div style="flex:1;min-width:0"><b style="font-size:13px">${h[0]}, ${h[1]}</b><div style="font-size:10.5px;color:var(--dim)">${h[2]}</div></div><span class="cb">${V}</span></div></div>`,
 '2 · White card':(h,i)=>`<div class="card" style="background:#fff;border:1px solid var(--ln);box-shadow:0 14px 26px -18px rgba(255,77,141,.7)">
  <div style="height:118px;position:relative;background:linear-gradient(150deg,${G[i][0]},${G[i][1]})"><i class="orb" style="width:90px;height:90px;right:-20px;top:-26px;background:rgba(255,255,255,.2)"></i>
   <div class="abs" style="left:8px;top:8px">${st(h)}</div><div class="av abs" style="left:50%;bottom:-24px;transform:translateX(-50%);width:62px;height:62px;font-size:25px;background:linear-gradient(150deg,${G[(i+1)%4][0]},${G[(i+1)%4][1]});border:4px solid #fff">${h[0][0]}</div></div>
  <div style="padding:30px 10px 11px;text-align:center"><b style="font-size:14px">${h[0]}, ${h[1]}</b><div style="font-size:10.5px;color:var(--dim)">${h[2]}</div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-top:9px"><span class="pill" style="background:#fff7e0;color:var(--gold)"><span class="coin">V</span>${h[3]}/min</span><span class="cb">${V}</span></div></div></div>`,
 '3 · Poster waves':(h,i)=>`<div class="card" style="aspect-ratio:.8;background:linear-gradient(160deg,${G[i][0]},${G[i][1]})">
  <svg class="abs" viewBox="0 0 100 100" preserveAspectRatio="none" style="inset:0;width:100%;height:100%"><path d="M0 62 Q25 48 50 62 T100 58 V100 H0Z" fill="rgba(255,255,255,.14)"/><path d="M0 78 Q30 64 60 78 T100 74 V100 H0Z" fill="rgba(255,255,255,.18)"/></svg>
  <div class="abs" style="left:10px;top:10px">${st(h)}</div><div class="abs" style="right:10px;top:10px">${pr(h)}</div>
  <div class="av abs" style="right:12px;top:46px;width:34px;height:34px;font-size:15px;background:rgba(255,255,255,.3)">${h[0][0]}</div>
  <div class="abs" style="left:12px;bottom:12px;color:#fff"><b style="font-size:16px;font-weight:900">${h[0]}, ${h[1]}</b><div style="font-size:11px;opacity:.9">${h[2]}</div></div>
  <span class="cb abs" style="right:10px;bottom:10px;background:#fff;color:var(--p1);box-shadow:none;width:40px;height:40px">${V}</span></div>`,
 '4 · Wide row card':(h,i)=>`<div class="card" style="background:#fff;border:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:9px;grid-column:1/3">
  <div class="av" style="width:66px;height:66px;border-radius:20px;font-size:26px;position:relative;flex-shrink:0;background:linear-gradient(150deg,${G[i][0]},${G[i][1]})">${h[0][0]}<i class="dg abs" style="right:-2px;bottom:-2px;width:13px;height:13px;border:2.5px solid #fff;${h[4]=='Busy'?'background:#fb923c':''}"></i></div>
  <div style="flex:1;min-width:0"><b style="font-size:14px">${h[0]}, ${h[1]}</b><div style="font-size:11px;color:var(--dim)">${h[2]} · ${h[4]}</div><div style="margin-top:5px"><span class="pill" style="background:#fff7e0;color:var(--gold)"><span class="coin">V</span>${h[3]}/min</span></div></div><span class="cb" style="width:42px;height:42px">${V}</span></div>`
};
document.getElementById('g').innerHTML=Object.entries(opts).map(([t,f])=>`<div><div class="lab">${t}</div><div class="ph"><div class="two">${H.map((h,i)=>f(h,i)).join('')}</div></div></div>`).join('');
</script></body></html>
